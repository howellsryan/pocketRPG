<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketRPG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0e0e12; overflow: hidden; }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0e0e12;
      color: #d4af6a;
      font-family: sans-serif;
      font-size: 16px;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #loader svg {
      animation: spin 1s linear infinite;
      opacity: 0.8;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #blocked {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #0e0e12;
      color: #e8d5b0;
      font-family: sans-serif;
      font-size: 15px;
      text-align: center;
      padding: 24px;
    }
    #blocked a {
      color: #d4af6a;
      font-weight: bold;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="loader">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <circle cx="18" cy="18" r="15" stroke="#d4af6a" stroke-width="3" stroke-dasharray="60 30" />
    </svg>
    Loading PocketRPG…
  </div>

  <div id="blocked">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <circle cx="18" cy="18" r="15" stroke="#d4af6a" stroke-width="2" />
      <line x1="11" y1="11" x2="25" y2="25" stroke="#d4af6a" stroke-width="2" stroke-linecap="round"/>
      <line x1="25" y1="11" x2="11" y2="25" stroke="#d4af6a" stroke-width="2" stroke-linecap="round"/>
    </svg>
    This platform doesn't allow embedding external games.<br>
    <a href="https://pocketrpg.co.uk" target="_blank" rel="noopener">Play PocketRPG at pocketrpg.co.uk ↗</a>
  </div>

  <iframe
    id="game"
    src="https://pocketrpg.co.uk?host=1"
    allow="fullscreen"
    title="PocketRPG"
  ></iframe>

  <script>
    var frame  = document.getElementById('game');
    var loader = document.getElementById('loader');
    var blocked = document.getElementById('blocked');

    function hideLoader() {
      loader.style.opacity = '0';
      setTimeout(function () { loader.style.display = 'none'; }, 400);
    }

    // Primary: hide loader as soon as iframe fires load
    frame.addEventListener('load', hideLoader);

    // Fallback A: if load hasn't fired after 8s, hide anyway
    var loaderTimeout = setTimeout(hideLoader, 8000);
    frame.addEventListener('load', function () { clearTimeout(loaderTimeout); });

    // Fallback B: after 10s check if the iframe appears empty (platform blocked it)
    // We can't read cross-origin content, but a zero naturalWidth on a dummy img
    // inside an empty document would show up — instead just check scrollWidth.
    // Reliable signal: contentDocument is null when the iframe is sandboxed/blocked.
    setTimeout(function () {
      try {
        // If we can access contentDocument and it has no body content,
        // or if src was refused, contentDocument may be null or empty.
        var doc = frame.contentDocument || frame.contentWindow && frame.contentWindow.document;
        if (!doc || doc.body === null || (doc.body && doc.body.childNodes.length === 0)) {
          loader.style.display = 'none';
          blocked.style.display = 'flex';
        }
      } catch (e) {
        // Cross-origin: iframe loaded pocketrpg.co.uk successfully — this is expected
      }
    }, 10000);
  </script>
</body>
</html>
