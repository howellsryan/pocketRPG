<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PocketRPG · 3D Preview & Weapon Aligner</title>
<!--
  Standalone dev harness (NOT part of the app bundle). It renders a character
  GLB and, optionally, a weapon GLB attached to a chosen bone/anchor, with live
  offset sliders so you can position a weapon in the hand and read off the exact
  registry entry to paste into src/data/equipmentModels.json.

  REGISTRY-FIRST: on load it fetches /src/data/equipmentModels.json (served on
  Vite dev and on deployments — pages_build_output_dir is the repo root) and
  lists every registered weapon. Picking one loads the hero AND the weapon from
  the registry's own paths — including /api/tripo-assets/ R2 URLs on a deployed
  preview — with the exact bone semantics the runtime resolver uses (absent
  bone → defaults.handBone; explicit null → model root) and the entry's
  effective transform (falling back to defaults.weapon) pre-applied to the
  sliders. What you see is what ships. The emitted JSON is the full registry
  entry; when the transform equals defaults.weapon it collapses to { model }
  (a canonical import needs nothing else). File pickers remain for GLBs that
  aren't uploaded yet (R2 URLs only resolve on a deployment, not local dev).

  PRESETS (head/boots): two extra dropdown entries show the SHARED default art
  every helmet/boots item renders until per-item art exists, sourced from
  defaults.gear.head.fallbackModel and defaults.gear.boots.model (not itemId-
  keyed, so they're not in the registry list above). The head preset is a rigid
  helm shell: it seeds the sliders from defaults.gear.head and emits the plain
  { bone, position, rotationDeg, scale } object — paste it back into
  defaults.gear.head. The boots preset is a SKINNED piece (outfits/ranger_boots.glb,
  the same rigged boot baked into ranger_legs) — it rebinds onto the hero
  skeleton like a platebody, so there's nothing to tune; the sliders are inert
  and it's here just to preview what ships. Individually-modelled head gear (the
  wizard hat) IS a registry entry, so it shows up under "gear / shields" above.

  Uses the same vendored three.js the app will use (public/vendor/three/*),
  loaded via relative paths so it works both in Vite dev (served at /) and in
  the deployed single-file build (served at /public/). Open:
    dev:      http://localhost:5173/3d-preview.html
    deployed: /public/3d-preview.html
-->
<style>
  :root { --bg:#161310; --panel:#201b16; --line:#362e25; --ink:#ece4d6; --soft:#b3a894; --ember:#e08a4a; --mono:ui-monospace,Menlo,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #panel { position:fixed; top:0; right:0; width:min(340px,90vw); max-height:100vh; overflow-y:auto;
    background:color-mix(in srgb, var(--panel) 92%, transparent); border-left:1px solid var(--line);
    padding:14px 16px calc(14px + env(safe-area-inset-bottom)); font-size:13px; backdrop-filter:blur(6px); }
  h1 { font-size:14px; letter-spacing:.04em; margin:0 0 2px; }
  .sub { color:var(--soft); font-size:11px; margin:0 0 12px; }
  .grp { border-top:1px solid var(--line); padding:11px 0; }
  label { display:block; color:var(--soft); font-size:11px; text-transform:uppercase; letter-spacing:.06em; margin:0 0 5px; }
  select, input[type=file], button { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:7px 9px; font-size:12px; margin-bottom:8px; }
  button { cursor:pointer; }
  button.on { border-color:var(--ember); color:var(--ember); }
  .row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .row span { width:14px; color:var(--ember); font-family:var(--mono); }
  .row input[type=range] { flex:1; accent-color:var(--ember); }
  .row output { width:52px; text-align:right; font-family:var(--mono); font-size:11px; color:var(--ink); }
  #xform { font-family:var(--mono); font-size:10.5px; color:var(--soft); white-space:pre-wrap; word-break:break-all;
    background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px; margin-top:4px; }
  #info { font-family:var(--mono); font-size:10.5px; color:var(--soft); line-height:1.5; }
  .err { color:#e0564b; }
  #copy { background:var(--ember); color:#161310; border:none; font-weight:700; }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="panel">
  <h1>3D Preview · Weapon & Gear Aligner</h1>
  <p class="sub">Position a weapon or shield on the hero, then copy the transform into the registry. The offset is bone-relative, so it holds in every pose.</p>

  <div class="grp">
    <label>Registry item (weapons + gear/shields)</label>
    <select id="regItem">
      <option value="">(custom files)</option>
      <option value="preset:head">— Default Head (helm) —</option>
      <option value="preset:boots">— Default Boots (skinned) —</option>
    </select>
    <label>Character GLB</label>
    <input type="file" id="charFile" accept=".glb,.gltf">
    <label>Weapon / gear GLB</label>
    <input type="file" id="weapFile" accept=".glb,.gltf">
    <label>Attach to bone</label>
    <select id="bone"><option value="__root">(model root)</option></select>
  </div>

  <div class="grp">
    <label>Position offset</label>
    <div class="row"><span>x</span><input type="range" id="px" min="-1" max="1" step="0.005" value="0"><output id="pxo">0</output></div>
    <div class="row"><span>y</span><input type="range" id="py" min="-1" max="1" step="0.005" value="0"><output id="pyo">0</output></div>
    <div class="row"><span>z</span><input type="range" id="pz" min="-1" max="1" step="0.005" value="0"><output id="pzo">0</output></div>
    <label>Rotation (deg)</label>
    <div class="row"><span>x</span><input type="range" id="rx" min="-180" max="180" step="1" value="0"><output id="rxo">0</output></div>
    <div class="row"><span>y</span><input type="range" id="ry" min="-180" max="180" step="1" value="0"><output id="ryo">0</output></div>
    <div class="row"><span>z</span><input type="range" id="rz" min="-180" max="180" step="1" value="0"><output id="rzo">0</output></div>
    <label>Scale</label>
    <div class="row"><span>s</span><input type="range" id="sc" min="0.05" max="5" step="0.01" value="1"><output id="sco">1</output></div>
  </div>

  <div class="grp">
    <button id="spin" class="on">⟳ Turntable: on</button>
    <button id="anim">▶ Play idle clip</button>
    <button id="lunge">⚔ Test attack lunge</button>
  </div>

  <div class="grp">
    <label>Registry transform</label>
    <div id="xform">—</div>
    <button id="copy">Copy JSON</button>
  </div>

  <div class="grp"><div id="info">loading…</div></div>
</div>

<script type="module">
import * as THREE from './vendor/three/three.module.min.js';
import { GLTFLoader } from './vendor/three/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from './vendor/three/jsm/libs/meshopt_decoder.module.js';
import { OrbitControls } from './vendor/three/jsm/controls/OrbitControls.js';
// Reuse the REAL runtime tint + skinned-outfit rebind logic (same module the
// arena-hero-harness uses) so this aligner shows exactly what ships — a piece
// with no tint or a naive bone-parent would otherwise look right here and
// wrong in-game.
import { applyEquipTint, setupHideMask, disposeObject } from '/src/3d/heroAttach.js';

const $ = id => document.getElementById(id);
const info = $('info');
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xfff2e0, 0x2a1c10, 2.0));
const key = new THREE.DirectionalLight(0xfff2e0, 2.4); key.position.set(3, 5, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x88bbff, 1.0); rim.position.set(-4, 2, -3); scene.add(rim);

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.autoRotate = true; controls.autoRotateSpeed = 1.8;

const rig = new THREE.Group(); scene.add(rig);         // holds character, normalised to ~1.8 units tall
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
let mixer = null, idleAction = null, clock = new THREE.Clock();
let charRoot = null, weapon = null, weaponAnchor = null, bones = {};
let heroSkinned = null, headMaskCtl = null, gearBound = null; // skinned-outfit rebind state
let lungeT = 0;

// Skinned outfit pieces (body/legs slot: Quaternius exports sharing the
// hero's own skeleton) get rebound onto the hero's LIVE skeleton instead of
// bone-parented — mirrors heroAttach.attachGearList exactly. These never take
// a manual position/rotation/scale in production, so the sliders are
// intentionally inert for them.
function clearGearBound() {
  if (gearBound) {
    for (const o of gearBound.objs) { gearBound.anchor.remove(o); disposeObject(o); }
    gearBound = null;
  }
  if (headMaskCtl) headMaskCtl.setHidden({});
}

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
const stage = $('stage');
addEventListener('resize', resize); resize();

function frameCharacter(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
  const scale = 1.8 / (size.y || 1);
  obj.scale.setScalar(scale);
  obj.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);
  camera.position.set(0, 1.1, 4.2); controls.target.set(0, 0.95, 0); controls.update();
}

async function loadChar(url) {
  if (charRoot) { rig.remove(charRoot); }
  bones = {}; weaponAnchor = null; mixer = null; idleAction = null;
  gearBound = null; heroSkinned = null; headMaskCtl = null; // old bindings died with charRoot
  const boneSel = $('bone'); boneSel.innerHTML = '<option value="__root">(model root)</option>';
  try {
    const gltf = await loader.loadAsync(url);
    charRoot = gltf.scene; rig.add(charRoot); frameCharacter(charRoot);
    let tris = 0, skinned = 0;
    const skinnedMeshes = [];
    charRoot.traverse(o => {
      if (o.isMesh) { const g = o.geometry; tris += (g.index ? g.index.count : g.attributes.position.count) / 3; }
      if (o.isSkinnedMesh) { skinned++; skinnedMeshes.push(o); }
      if (o.isBone) { bones[o.name] = o; const op = document.createElement('option'); op.value = o.name; op.textContent = o.name; boneSel.appendChild(op); }
    });
    heroSkinned = skinnedMeshes.slice().sort((a, b) => b.geometry.attributes.position.count - a.geometry.attributes.position.count)[0] || null;
    headMaskCtl = setupHideMask(THREE, skinnedMeshes);
    if (gltf.animations.length) {
      mixer = new THREE.AnimationMixer(charRoot);
      // prefer the registry's idle clip so the hero drops out of T-pose into
      // its in-game stance — a hand_l shield then reads next to the body
      // instead of splayed out behind the panel
      const idleName = registry?.character?.idleClip;
      const clip = (idleName && gltf.animations.find(a => a.name === idleName)) || gltf.animations[0];
      idleAction = mixer.clipAction(clip);
      idleAction.play();
    }
    info.innerHTML = `char: ${Math.round(tris).toLocaleString()} tris · skinned:${skinned}` +
      `\nbones: ${Object.keys(bones).length}` +
      `\nclips: ${gltf.animations.map(a=>a.name).join(', ') || 'none'}` +
      (skinned ? '' : '\n<span class="err">no rig — bones/anim need the rigged Tripo export</span>');
    if (weapon) attachWeapon();
  } catch (e) { info.innerHTML = '<span class="err">char load failed: ' + e.message + '</span>'; }
}

async function loadWeapon(url, spec) {
  clearGearBound();
  if (weapon && weaponAnchor) { weaponAnchor.remove(weapon); disposeObject(weapon); weapon = null; }
  try {
    const gltf = await loader.loadAsync(url);
    // Body/legs outfit pieces (Quaternius exports sharing the hero's own
    // skeleton) never take a bone/position — they rebind onto the hero's live
    // skeleton, exactly like heroAttach.attachGearList. A naive bone-parent
    // (what this tool did before) left the piece unposed and duplicated the
    // whole body, which is why armour looked like "a second character".
    const pieceSkinned = [];
    gltf.scene.traverse(o => { if (o.isSkinnedMesh) pieceSkinned.push(o); });
    // Only body/legs outfit pieces (marked by their region hide-flag) rebind
    // onto the hero skeleton — exactly heroAttach.attachGearList's guard. A
    // skinned PROP with its own rig (the cape's drape skeleton) must NOT rebind:
    // binding its 13 mismatched bones onto the hero's 41-bone skeleton with the
    // hero's bindMatrix blew the cape up to hero scale (huge). It falls through
    // to rigid bone-attach with its registry transform instead.
    if (pieceSkinned.length && heroSkinned && (spec?.hideBody || spec?.hideLegs || spec?.hideFeet)) {
      const objs = [];
      for (const ps of pieceSkinned) {
        ps.bind(heroSkinned.skeleton, heroSkinned.bindMatrix);
        applyEquipTint(THREE, ps, spec?.tint, true); // skinned outfit: already all-materials
        heroSkinned.parent.add(ps);
        objs.push(ps);
      }
      gearBound = { objs, anchor: heroSkinned.parent };
      if (headMaskCtl) headMaskCtl.setHidden({ head: !!spec?.hideHead, torso: !!spec?.hideBody, legs: !!spec?.hideLegs });
      info.innerHTML += '<br>skinned outfit piece — rebinds to hero skeleton, sliders inactive';
      updateXform();
      return;
    }
    weapon = gltf.scene;
    applyEquipTint(THREE, weapon, spec?.tint, spec?.tintAll);
    attachWeapon(); updateXform();
  } catch (e) { info.innerHTML += '<br><span class="err">weapon load failed: ' + e.message + '</span>'; }
}

function attachWeapon() {
  if (!weapon) return;
  if (weaponAnchor) weaponAnchor.remove(weapon);
  const boneName = $('bone').value;
  weaponAnchor = (boneName !== '__root' && bones[boneName]) ? bones[boneName] : charRoot;
  weaponAnchor.add(weapon);
  applyOffset();
}

function applyOffset() {
  if (!weapon) return;
  weapon.position.set(+$('px').value, +$('py').value, +$('pz').value);
  weapon.rotation.set(THREE.MathUtils.degToRad(+$('rx').value), THREE.MathUtils.degToRad(+$('ry').value), THREE.MathUtils.degToRad(+$('rz').value));
  weapon.scale.setScalar(+$('sc').value);
}

function updateXform() {
  const r = v => Math.round(v * 1000) / 1000;
  const t = {
    bone: $('bone').value === '__root' ? null : $('bone').value,
    position: [r(+$('px').value), r(+$('py').value), r(+$('pz').value)],
    rotationDeg: [+$('rx').value, +$('ry').value, +$('rz').value],
    scale: r(+$('sc').value),
  };
  if (regItemId && registry) {
    // Emit the full registry entry; collapse to the canonical minimum when the
    // transform is exactly the slot defaults. Existing `tint` is carried
    // through so a copy-paste of the whole entry is lossless.
    const d = registry.defaults || {};
    if (regKind === 'gear') {
      const src = registry.gear?.[regItemId] || {};
      const dg = (d.gear || {})[regSlot] || {};
      const matchesDefault = t.bone === (dg.bone ?? null) &&
        JSON.stringify(t.position) === JSON.stringify(dg.position) &&
        JSON.stringify(t.rotationDeg) === JSON.stringify(dg.rotationDeg) &&
        t.scale === dg.scale;
      const entry = matchesDefault ? { model: src.model, slot: regSlot } : { model: src.model, slot: regSlot, ...t };
      if (src.tint) entry.tint = src.tint;
      $('xform').textContent = JSON.stringify({ [regItemId]: entry }, null, 2) +
        (matchesDefault ? `\n(matches defaults.gear.${regSlot} — canonical)` : '');
      return { [regItemId]: entry };
    }
    const dw = d.weapon || {};
    const src = registry.weapons?.[regItemId] || {};
    const matchesDefault = t.bone === (d.handBone ?? null) &&
      JSON.stringify(t.position) === JSON.stringify(dw.position) &&
      JSON.stringify(t.rotationDeg) === JSON.stringify(dw.rotationDeg) &&
      t.scale === dw.scale;
    const entry = matchesDefault ? { model: src.model } : { model: src.model, ...t };
    if (src.tint) entry.tint = src.tint;
    $('xform').textContent = JSON.stringify({ [regItemId]: entry }, null, 2) +
      (matchesDefault ? '\n(matches defaults.weapon — canonical)' : '');
    return { [regItemId]: entry };
  }
  $('xform').textContent = JSON.stringify(t, null, 2);
  return t;
}

// ── Registry mode: pick a registered weapon/gear, see exactly what ships ──
let registry = null, regItemId = null, regKind = 'weapon', regSlot = null, charFromRegistry = false;
// Models without a "*steel*"-named material (see src/utils/equipModels.js
// TINT_ALL_MODELS for why) — keep this list in sync with that one.
const TINT_ALL_MODELS = new Set([
  'weapons/mace.glb', 'weapons/talwar.glb', 'weapons/pickaxe.glb',
  'weapons/crossbow.glb', 'weapons/spear.glb', 'weapons/staff.glb', 'weapons/trident.glb',
  'shields/q_celtic.gltf',
]);
function registryUrl(model) {
  if (!model) return null;
  if (/^(https?:)?\/\//.test(model) || model.startsWith('/')) return model;
  return './' + (registry.modelBase || '') + model; // page dir = asset root in dev AND deployed
}
function resolveRegistryWeapon(id) {
  const w = registry.weapons[id], d = registry.defaults || {}, dw = d.weapon || {};
  return {
    model: w.model,
    bone: w.bone === undefined ? (d.handBone || null) : w.bone,
    position: w.position || dw.position || [0, 0, 0],
    rotationDeg: w.rotationDeg || dw.rotationDeg || [0, 0, 0],
    scale: typeof w.scale === 'number' ? w.scale : (typeof dw.scale === 'number' ? dw.scale : 1),
    tint: w.tint || null,
    tintAll: TINT_ALL_MODELS.has(w.model) ? 'replace' : false,
  };
}
function resolveRegistryGear(id) {
  const g = registry.gear[id], slot = g.slot, dg = ((registry.defaults || {}).gear || {})[slot] || {};
  return {
    model: g.model, slot,
    bone: g.bone === undefined ? (dg.bone || null) : g.bone,
    position: g.position || dg.position || [0, 0, 0],
    rotationDeg: g.rotationDeg || dg.rotationDeg || [0, 0, 0],
    scale: typeof g.scale === 'number' ? g.scale : (typeof dg.scale === 'number' ? dg.scale : 1),
    tint: g.tint || null,
    tintAll: TINT_ALL_MODELS.has(g.model) ? 'replace' : false,
    hideHead: Boolean(g.hideHead), hideBody: Boolean(g.hideBody), hideLegs: Boolean(g.hideLegs),
  };
}
async function loadRegistry() {
  try {
    const res = await fetch('/src/data/equipmentModels.json', { cache: 'no-store' });
    if (!res.ok) return;
    registry = await res.json();
    const sel = $('regItem');
    const group = (label, ids, prefix) => {
      if (!ids.length) return;
      const og = document.createElement('optgroup'); og.label = label;
      for (const id of ids) { const op = document.createElement('option'); op.value = prefix + id; op.textContent = id; og.appendChild(op); }
      sel.appendChild(og);
    };
    group('weapons', Object.keys(registry.weapons || {}), '');
    group('gear / shields', Object.keys(registry.gear || {}), 'gear:');
  } catch { /* file-picker-only mode */ }
}
// Unregistered defaults (head/boots): loaded straight from a known
// public/3d-samples path rather than a registry itemId, so updateXform's
// registry branch is skipped and the plain { bone, position, rotationDeg,
// scale } transform is emitted — head → paste into defaults.gear.head; boot L/R
// → defaults.gear.boots.{left,right}. Boots are two rigid props (one per foot
// bone) because the feet move independently, so each foot is tuned separately.
function presetDefs() {
  const g = ((registry || {}).defaults || {}).gear || {};
  const dHead = g.head || {}, dBoots = g.boots || {};
  return {
    head: { url: './3d-samples/' + (dHead.fallbackModel || 'full_helm.glb'),
      seed: { position: dHead.position || [0, 0.09, 0.01], rotationDeg: dHead.rotationDeg || [0, 0, 0], scale: typeof dHead.scale === 'number' ? dHead.scale : 0.44, bone: dHead.bone || 'Head' } },
    // Boots are a SKINNED piece (rebinds onto the hero skeleton, sliders inert)
    // — nothing to tune, this preset just shows what ships.
    boots: { url: './' + (registry?.modelBase || '3d-samples/') + (dBoots.model || 'outfits/ranger_boots.glb'),
      spec: { hideFeet: true, tint: dBoots.tint || null } },
  };
}
async function loadPreset(slot) {
  regItemId = null; regKind = 'gear'; regSlot = null;
  if (!charRoot) {
    if (registry?.character) { await loadChar(registryUrl(registry.character.model)); charFromRegistry = true; }
    else await loadChar('./3d-samples/hero.glb');
  }
  const def = presetDefs()[slot];
  if (def.seed) {
    const seed = def.seed;
    for (const [id, v] of [['px', seed.position[0]], ['py', seed.position[1]], ['pz', seed.position[2]],
      ['rx', seed.rotationDeg[0]], ['ry', seed.rotationDeg[1]], ['rz', seed.rotationDeg[2]], ['sc', seed.scale]]) {
      $(id).value = v; $(id + 'o').textContent = v;
    }
    $('bone').value = seed.bone && bones[seed.bone] ? seed.bone : '__root';
  }
  await loadWeapon(def.url, def.spec);
  updateXform();
}
$('regItem').addEventListener('change', async () => {
  const raw = $('regItem').value || '';
  if (raw.startsWith('preset:')) { await loadPreset(raw.slice('preset:'.length)); return; }
  if (!raw || !registry) { regItemId = null; updateXform(); return; }
  const isGear = raw.startsWith('gear:');
  regKind = isGear ? 'gear' : 'weapon';
  regItemId = isGear ? raw.slice(5) : raw;
  const spec = isGear ? resolveRegistryGear(regItemId) : resolveRegistryWeapon(regItemId);
  regSlot = isGear ? spec.slot : null;
  if (!charFromRegistry && registry.character) {
    await loadChar(registryUrl(registry.character.model));
    charFromRegistry = true;
  }
  for (const [id, v] of [['px', spec.position[0]], ['py', spec.position[1]], ['pz', spec.position[2]],
    ['rx', spec.rotationDeg[0]], ['ry', spec.rotationDeg[1]], ['rz', spec.rotationDeg[2]], ['sc', spec.scale]]) {
    $(id).value = v; $(id + 'o').textContent = v;
  }
  $('bone').value = spec.bone && bones[spec.bone] ? spec.bone : '__root';
  await loadWeapon(registryUrl(spec.model), spec);
  updateXform();
});

// wire sliders
for (const id of ['px','py','pz','rx','ry','rz','sc']) {
  const el = $(id), out = $(id + 'o');
  el.addEventListener('input', () => { out.textContent = el.value; applyOffset(); updateXform(); });
  out.textContent = el.value;
}
$('bone').addEventListener('change', () => { attachWeapon(); updateXform(); });
$('charFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) { charFromRegistry = false; loadChar(URL.createObjectURL(f)); } });
$('weapFile').addEventListener('change', e => { const f = e.target.files[0]; if (f) { regItemId = null; $('regItem').value = ''; loadWeapon(URL.createObjectURL(f)); updateXform(); } });
$('spin').addEventListener('click', () => { controls.autoRotate = !controls.autoRotate; $('spin').classList.toggle('on', controls.autoRotate); $('spin').textContent = `⟳ Turntable: ${controls.autoRotate?'on':'off'}`; });
$('anim').addEventListener('click', () => { if (idleAction) { idleAction.reset().play(); } });
$('lunge').addEventListener('click', () => { lungeT = 0.0001; });
$('copy').addEventListener('click', async () => { try { updateXform(); await navigator.clipboard.writeText($('xform').textContent.replace(/\n\(matches[^)]*\)$/, '')); $('copy').textContent = 'Copied ✓'; setTimeout(()=>$('copy').textContent='Copy JSON', 1200); } catch {} });

// Transform-fake attack: a quick forward lunge + recoil of the whole rig (the
// Phase-2 approach for the un-rigged dragon; also previews warrior motion).
function stepLunge(dt) {
  if (!lungeT) return;
  lungeT += dt * 2.6;
  const t = lungeT;
  const p = t < 1 ? Math.sin(Math.min(t, 1) * Math.PI) : 0;     // 0→1→0 ease
  rig.position.z = p * 0.5;
  rig.rotation.x = -p * 0.12;
  if (t >= 1) { lungeT = 0; rig.position.z = 0; rig.rotation.x = 0; }
}

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer) mixer.update(dt);
  stepLunge(dt);
  controls.update();
  renderer.render(scene, camera);
});

// Boot: registry hero when available, sample fallback otherwise.
await loadRegistry();
if (registry?.character) {
  charFromRegistry = true;
  await loadChar(registryUrl(registry.character.model));
} else {
  await loadChar('./3d-samples/hero.glb');
  await loadWeapon('./3d-samples/crimson_dagger.glb');
}
updateXform();
</script>
