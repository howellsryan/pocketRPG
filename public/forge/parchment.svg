<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  
  <defs>
    <filter id="fibre" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="4" seed="7" stitchTiles="stitch" result="n"></feTurbulence>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 0 0.16  0 0 0 0.5 0"></feColorMatrix>
    </filter>
    <filter id="mottle" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="3" seed="22" stitchTiles="stitch" result="m"></feTurbulence>
      <feColorMatrix in="m" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 0 0.10  0 0 0 0.6 0"></feColorMatrix>
    </filter>
  </defs>
  <rect width="600" height="600" fill="#e6d8b6"></rect>
  <rect width="600" height="600" filter="url(#mottle)" opacity="0.5"></rect>
  <rect width="600" height="600" filter="url(#fibre)" opacity="0.35"></rect>
</svg>