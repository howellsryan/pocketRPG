name: Logic Regression Pack

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

# Newer commits on the same ref supersede in-flight runs — only the latest
# result matters, so cancel the ones we no longer care about.
concurrency:
  group: logic-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logic-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PRs run the suite without coverage instrumentation (faster). Coverage +
      # the ratchet run only on main, where they gate post-merge. The suite runs
      # once here; we deliberately DO NOT call `npm run ci` (its build prebuild
      # would execute the suite again). See docs/testing-strategy-review.md.
      - name: Test (PR — no coverage)
        if: github.event_name == 'pull_request'
        run: npm test

      - name: Test with coverage (main)
        if: github.event_name == 'push'
        run: npm run test:coverage

      - name: Coverage ratchet (main, report-only)
        if: github.event_name == 'push'
        run: node scripts/check-coverage-ratchet.cjs

      - name: Build (suite already ran above)
        run: npx vite build

      - name: Single-file rebuild + safety check
        run: npm run rebuild && npm run check:single
