name: Sunspire readability verification
on:
  push:
    branches:
      - feature/sunspire-colosseum

permissions:
  contents: write

concurrency:
  group: sunspire-readability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sunspire readability regression pack
        run: >
          npm test --
          tests/sunspireMechanics.test.ts
          tests/sunspireCoop.test.ts
          tests/sunspireColosseum.test.ts
          tests/monsterFigures.test.ts
      - name: Regenerate monster preview
        run: npm run gen:monster-preview
      - name: Commit generated monster preview
        run: |
          if git diff --quiet -- public/monster-menagerie.html; then
            echo "Monster preview already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/monster-menagerie.html
          git commit -m "chore: regenerate monster preview [skip ci]"
          git push origin HEAD:feature/sunspire-colosseum
      - name: Full app CI
        run: npm run ci
