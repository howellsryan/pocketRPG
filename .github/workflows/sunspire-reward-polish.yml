name: Sunspire reward polish verification
on:
  push:
    branches:
      - feature/sunspire-colosseum

concurrency:
  group: sunspire-reward-polish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused Sunspire regressions
        run: npm test -- tests/combatInfoSheets.test.ts tests/sunspireEquipment.test.ts tests/sunspireColosseum.test.ts tests/bespokeIcons.test.ts
      - name: Gear balance benchmark
        run: node scripts/gear-benchmark.cjs
      - name: Sunspire drop audit
        run: npm run check:drops -- sunspire_colosseum
      - name: Full app CI
        run: npm run ci
