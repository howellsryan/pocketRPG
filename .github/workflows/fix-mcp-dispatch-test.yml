name: Fix build test fixtures

on:
  push:
    branches:
      - rh/buff-primeval-boots

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rh/buff-primeval-boots
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fix deterministic test fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mcp = Path('tests/mcpServer.test.ts')
          text = mcp.read_text()
          old = '''describe('MCP dispatch', () => {
            // Empty env: handlers fail auth/DB and surface as isError results, but a
            // *known* tool must never throw "Unknown tool" — this guards schema/dispatch drift.
            const ctx = { env: {}, authorization: null } as any
          '''
          new = '''describe('MCP dispatch', () => {
            // Most handlers fail auth and surface as isError results. get_leaderboard is
            // intentionally public, so it reaches D1; give the dispatch smoke test a
            // minimal read-only DB double rather than generating an expected console error.
            const dispatchDb = {
              prepare: () => ({
                bind: () => ({
                  all: async () => ({ results: [] }),
                  first: async () => null,
                  run: async () => ({ meta: { changes: 0 } }),
                }),
              }),
            }
            const ctx = { env: { DB: dispatchDb }, authorization: null } as any
          '''
          if old not in text:
              raise SystemExit('Expected MCP dispatch fixture was not found')
          mcp.write_text(text.replace(old, new, 1))

          daily = Path('tests/dailyTasksProgressEndpoint.test.ts')
          text = daily.read_text()
          old = '''function issueTask(characterId: number, taskId: string, target: number) {
            raw.prepare(
              `INSERT INTO character_daily_tasks (character_id, task_date, slot, task_id, tier, target, progress, credited, issued_at)
               VALUES (?, ?, 0, ?, 'Novice', ?, 0, 0, 0)`,
            ).run(characterId, today(), taskId, target)
          }
          '''
          new = '''function issueTask(characterId: number, taskId: string, target: number) {
            const date = today()
            raw.prepare(
              `INSERT INTO character_daily_tasks (character_id, task_date, slot, task_id, tier, target, progress, credited, issued_at)
               VALUES (?, ?, 0, ?, 'Novice', ?, 0, 0, 0)`,
            ).run(characterId, date, taskId, target)

            // The production endpoint fills missing daily-task slots before applying
            // events. Seed four valid, non-matching tasks so this fixture tests only
            // the task it explicitly issued and never depends on today's seeded pool.
            for (let slot = 1; slot < 5; slot++) {
              raw.prepare(
                `INSERT INTO character_daily_tasks (character_id, task_date, slot, task_id, tier, target, progress, credited, issued_at)
                 VALUES (?, ?, ?, 'gain_mining_xp', 'Novice', 500, 0, 0, 0)`,
              ).run(characterId, date, slot)
            }
          }
          '''
          if old not in text:
              raise SystemExit('Expected daily-task fixture was not found')
          daily.write_text(text.replace(old, new, 1))
          PY
      - name: Full repository CI
        run: npm run ci
      - name: Commit verified fixes and remove one-shot workflow
        run: |
          rm .github/workflows/fix-mcp-dispatch-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/mcpServer.test.ts tests/dailyTasksProgressEndpoint.test.ts .github/workflows/fix-mcp-dispatch-test.yml
          git commit -m "Stabilize build test fixtures"
          git push origin HEAD:rh/buff-primeval-boots
