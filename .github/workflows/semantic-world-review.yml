name: Semantic World Review

# Routine execution and evidence publication use Cloudflare Workers Builds.
# This fallback consumes GitHub Actions minutes only when deliberately dispatched.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-world-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            world/package-lock.json
      - name: Install root and world dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm rebuild esbuild
          npm --prefix world ci --no-audit --no-fund
      - name: Bootstrap pinned agent skills
        run: |
          python3 tools/agent-skills.py
          python3 tools/agent-skills.py --check
      - name: Exercise semantic authoring behavior
        run: npm --prefix world test -- tests/authoring.test.ts tests/tick.test.ts
      - name: Compile the semantic candidate and emit reproducible outputs
        run: npm --prefix world run author:build -- --emit
      - name: Install review browser
        run: |
          npx playwright install --with-deps chromium
          npm --prefix world exec -- playwright install chromium
      - name: Check the idle game
        run: npm run ci
      - name: Check the world
        run: npm run world:check
      - name: Render the procedural rat in all combat states
        run: node scripts/render-proc.mjs dustpaw_rat --out world/preview-shots/creatures
      - name: Capture desktop, mobile and integrated world views
        run: npm --prefix world run author:review
      - name: Verify checked-in outputs and current visual approval
        run: |
          git diff --exit-code -- world/zones/lumbright.json world/zones/overworld.json world/authoring/assets.generated.json world/authoring/reports/lumbright.json
          npm --prefix world run author:release
      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-lumbright-${{ github.sha }}
          path: |
            world/preview-shots/**
            world/authoring/reports/**
            world/authoring/assets.generated.json
          retention-days: 30
