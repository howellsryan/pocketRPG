name: Sunspire target handoff verification
on:
  push:
    branches:
      - feature/sunspire-colosseum

concurrency:
  group: sunspire-target-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Focused combat target regressions
        run: npm test -- tests/actionSprites.test.ts tests/sunspireMechanics.test.ts tests/inkwrightCombatShot.test.ts
      - name: Full app CI
        run: npm run ci
