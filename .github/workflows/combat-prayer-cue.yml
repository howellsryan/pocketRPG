name: Combat prayer cue verification
on:
  push:
    branches:
      - feature/sunspire-colosseum

concurrency:
  group: combat-prayer-cue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused prayer and combat animation regressions
        run: >
          npm test --
          tests/prayerIcons.test.ts
          tests/sunspireMechanics.test.ts
          tests/actionSprites.test.ts
          tests/inkwrightCombatShot.test.ts
          tests/sunspireCoop.test.ts
      - name: Full app CI
        run: npm run ci
