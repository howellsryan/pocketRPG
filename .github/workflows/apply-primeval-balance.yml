name: Apply Primeval boot balance patch

on:
  push:
    branches:
      - rh/buff-primeval-boots

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply Primeval boot balance
        shell: python
        run: |
          from pathlib import Path
          import json

          items_path = Path('src/data/items.json')
          text = items_path.read_text()
          start = text.index('  "primeval_boots": {')
          end = text.index('  "skyfury_boots": {', start)
          block = text[start:end]

          replacements = {
              '''    "attackBonus": {\n      "stab": 0,\n      "slash": 0,\n      "crush": 0,\n      "magic": -4,\n      "ranged": -1\n    },''': '''    "attackBonus": {\n      "stab": 16,\n      "slash": 16,\n      "crush": 16,\n      "magic": 0,\n      "ranged": 0\n    },''',
              '''    "defenceBonus": {\n      "stab": 22,\n      "slash": 22,\n      "crush": 22,\n      "magic": -4,\n      "ranged": -1\n    },''': '''    "defenceBonus": {\n      "stab": 22,\n      "slash": 22,\n      "crush": 22,\n      "magic": 0,\n      "ranged": 8\n    },''',
              '''    "otherBonus": {\n      "meleeStrength": 5,\n      "rangedStrength": 0,\n      "magicDamage": 0\n    },''': '''    "otherBonus": {\n      "meleeStrength": 11,\n      "rangedStrength": 0,\n      "magicDamage": 0,\n      "meleeDamage": 6\n    },''',
          }

          for old, new in replacements.items():
              if block.count(old) != 1:
                  raise SystemExit(f'Expected exactly one Primeval block match for: {old!r}')
              block = block.replace(old, new)

          text = text[:start] + block + text[end:]
          items_path.write_text(text)

          test_path = Path('tests/gear-balance.test.ts')
          tests = test_path.read_text()
          old_test = '''  it('Grondar Boots leads boots slot on melee strength and accuracy', () => {\n    for (const rival of ['spiked_manacles', 'primeval_boots', 'dragon_boots']) {\n      expect(str('grondar_boots')).toBeGreaterThan(str(rival))\n      expect(acc('grondar_boots')).toBeGreaterThan(acc(rival))\n    }\n  })'''
          new_test = '''  it('Primeval Boots are at least 20% stronger than Grondar across every Grondar combat stat', () => {\n    const primeval = (itemsData as any).primeval_boots\n    const grondar = (itemsData as any).grondar_boots\n\n    for (const group of ['attackBonus', 'defenceBonus', 'otherBonus']) {\n      for (const [stat, value] of Object.entries(grondar[group] ?? {})) {\n        const grondarValue = value as number\n        const primevalValue = (primeval[group]?.[stat] ?? 0) as number\n        if (grondarValue > 0) {\n          expect(primevalValue).toBeGreaterThanOrEqual(Math.ceil(grondarValue * 1.2))\n        } else if (grondarValue < 0) {\n          expect(primevalValue).toBeGreaterThan(grondarValue)\n        } else {\n          expect(primevalValue).toBeGreaterThanOrEqual(0)\n        }\n      }\n    }\n  })\n\n  it('Primeval Boots lead the boots slot on melee strength and accuracy', () => {\n    for (const rival of ['spiked_manacles', 'grondar_boots', 'dragon_boots']) {\n      expect(str('primeval_boots')).toBeGreaterThan(str(rival))\n      expect(acc('primeval_boots')).toBeGreaterThan(acc(rival))\n    }\n  })'''
          if tests.count(old_test) != 1:
              raise SystemExit('Expected exactly one Grondar boots balance test to replace')
          test_path.write_text(tests.replace(old_test, new_test))

          data = json.loads(items_path.read_text())
          primeval = data['primeval_boots']
          grondar = data['grondar_boots']
          for group in ('attackBonus', 'defenceBonus', 'otherBonus'):
              for stat, grondar_value in grondar.get(group, {}).items():
                  primeval_value = primeval.get(group, {}).get(stat, 0)
                  if grondar_value > 0:
                      required = int(grondar_value * 1.2 + 0.999999)
                      assert primeval_value >= required, (group, stat, primeval_value, required)
                  elif grondar_value < 0:
                      assert primeval_value > grondar_value, (group, stat, primeval_value, grondar_value)
                  else:
                      assert primeval_value >= 0, (group, stat, primeval_value)

      - name: Run targeted regression tests
        run: npm test -- tests/gear-balance.test.ts tests/data-contracts.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit verified balance change
        run: |
          rm .github/workflows/apply-primeval-balance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/items.json tests/gear-balance.test.ts .github/workflows/apply-primeval-balance.yml
          git commit -m "Balance Primeval boots above Grondar"
          git push
