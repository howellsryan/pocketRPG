name: Sunspire six-wave verification

on:
  push:
    branches:
      - feature/sunspire-colosseum

concurrency:
  group: sunspire-six-wave-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full application CI
        run: npm run ci
      - name: Preview site build
        env:
          WORKERS_CI_BRANCH: feature/sunspire-colosseum
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm run build:site
      - name: Preview Worker dry run
        env:
          WORKERS_CI_BRANCH: feature/sunspire-colosseum
        run: npx wrangler deploy --env preview --dry-run
