name: Sunspire follow-up verification
on:
  push:
    branches:
      - feature/sunspire-colosseum

concurrency:
  group: sunspire-followup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sunspire regression tests
        run: npm test -- tests/sunspireMechanics.test.ts tests/sunspireColosseum.test.ts
      - name: Verify bespoke icon generation is deterministic
        run: |
          node scripts/build-game-icons.cjs
          git diff --exit-code -- src/data/gameIcons.json NOTICE
      - name: Full app CI
        run: npm run ci
