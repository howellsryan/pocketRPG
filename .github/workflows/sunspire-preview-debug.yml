name: Sunspire preview build debug

on:
  push:
    branches:
      - feature/sunspire-colosseum

concurrency:
  group: sunspire-preview-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preview-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full application CI
        run: npm run ci
      - name: Build preview site
        env:
          WORKERS_CI_BRANCH: feature/sunspire-colosseum
        run: npm run build:site
      - name: Bundle preview worker without deploying
        env:
          WORKERS_CI_BRANCH: feature/sunspire-colosseum
        run: npx wrangler deploy --env preview --dry-run
