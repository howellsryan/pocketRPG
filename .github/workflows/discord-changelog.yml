name: Discord Changelog

on:
  push:
    branches: [main]

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Post changelog to Discord
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "DISCORD_CHANGELOG_WEBHOOK not set; skipping."
            exit 0
          fi

          # Find the PR this merge commit came from (empty on a direct push).
          pr_json=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            -H "Accept: application/vnd.github+json" 2>/dev/null || echo '[]')

          title=$(echo "$pr_json"  | jq -r '.[0].title    // empty')
          body=$(echo "$pr_json"   | jq -r '.[0].body     // empty')
          number=$(echo "$pr_json" | jq -r '.[0].number   // empty')

          # Fall back to the commit itself when no PR is associated.
          if [ -z "$title" ]; then
            title=$(printf '%s' "$COMMIT_MSG" | head -n1)
            body=$(printf '%s' "$COMMIT_MSG" | tail -n +2)
          fi

          # Drop PR-template HTML comment hints before publishing.
          body=$(printf '%s' "$body" | perl -0pe 's/<!--.*?-->//gs')

          # HARD STOP: strip any attribution/session trailer that slipped into
          # the title or body. This is the last gate before the public post —
          # nothing matching these patterns may ever reach Discord, regardless
          # of how it got into the PR. Delete offending lines, then collapse the
          # blank runs and trailing whitespace they leave behind.
          sanitize() {
            perl -0777 -pe '
              my @drop = (
                qr/^\s*Co-?authored-by:.*$/im,
                qr/^\s*Claude-Session:.*$/im,
                qr/^\s*(?:Generated (?:with|by)|🤖 Generated).*Claude.*$/im,
                qr/^.*claude\.ai\/code.*$/im,
                qr/^.*noreply\@anthropic\.com.*$/im,
                qr/^\s*session_[A-Za-z0-9_-]+\s*$/im,
                qr/^.*\b(?:made|written|authored|created|generated)\s+by\s+(?:Claude|an?\s+AI(?:\s+agent)?|Anthropic).*$/im,
              );
              foreach my $re (@drop) { s/$re//g; }
              s/[ \t]+$//mg;      # trailing spaces
              s/\n{3,}/\n\n/g;    # collapse blank-line runs
              s/^\s+|\s+$//g;     # trim ends
            '
          }
          title=$(printf '%s' "$title" | sanitize)
          body=$(printf '%s' "$body" | sanitize)

          # HARD STOP (fail-closed): if any banned token survived sanitizing,
          # abort the post rather than leak it. Better a missing changelog
          # entry than one carrying attribution into the public channel.
          if printf '%s\n%s' "$title" "$body" \
               | grep -iEq 'co-?authored-by|claude[- ]?session|claude\.ai/code|noreply@anthropic\.com|generated (with|by) .*claude|\bsession_[A-Za-z0-9_-]{6,}'; then
            echo "::error::Attribution/session token survived sanitizing; refusing to post changelog." >&2
            exit 1
          fi

          [ -n "$number" ] && title="$title (#$number)"

          payload=$(jq -n \
            --arg title "$title" \
            --arg desc "$body" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            '{
              embeds: [
                {
                  title: ($title[0:256]),
                  description: (if ($desc | gsub("^\\s+|\\s+$";"") | length) > 0
                               then ($desc[0:3900]) else null end),
                  color: 3447003,
                  timestamp: $ts,
                  footer: { text: "Now live on pocketrpg.co.uk" }
                } | with_entries(select(.value != null))
              ]
            }')

          curl -sS -f -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"
