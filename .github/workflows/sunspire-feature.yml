name: Sunspire feature verification
on:
  push:
    branches:
      - feature/sunspire-colosseum

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- tests/sunspireColosseum.test.ts tests/sunspireMechanics.test.ts tests/sunspireEquipment.test.ts tests/sunspireServer.test.ts
