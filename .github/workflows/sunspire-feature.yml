name: Sunspire feature verification
on:
  push:
    branches:
      - feature/sunspire-colosseum

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- tests/sunspireColosseum.test.ts tests/sunspireMechanics.test.ts tests/sunspireEquipment.test.ts tests/sunspireServer.test.ts tests/sunspireCoop.test.ts tests/coopBossEngine.test.ts tests/zarythEmptyLord.test.ts
      - run: npm run typecheck
      - run: npm run rebuild
      - run: npm run check:single
      - name: Sunspire content audits
        run: |
          npm run check:drops -- sunspire_colosseum
          node scripts/gear-benchmark.cjs --by-level
          echo "---- Sunspire gear rows ----"
          grep -i -n -E "sunweaver|twinflare|resonant|sunbound" reports/gear-benchmark.md || true
          node scripts/economy-benchmark.cjs --out=/tmp/economy-benchmark
          echo "---- Sunspire economy rows ----"
          grep -i -n -A4 -B4 "sunspire" /tmp/economy-benchmark.md || true
      - name: Verify generated chat knowledge
        run: |
          npm run gen:knowledge
          if ! git diff --exit-code -- functions/_lib/chat/knowledge.js; then
            git diff -- functions/_lib/chat/knowledge.js
            exit 1
          fi
