name = "pocketrpg"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "pocketrpg"
database_id = "439e810b-8dce-4697-94c2-a7392520ad8f"

[[r2_buckets]]
binding = "TRIPO_ASSETS"
bucket_name = "pocketrpg-tripo-assets"

[ai]
binding = "AI"

[vars]
APP_BASE_URL = "https://pocketrpg.co.uk"

# Secrets to set via dashboard or `wrangler pages secret put`:
#   JWT_SECRET                — random 32+ byte string used to sign session JWTs
#   GITHUB_CLIENT_ID          — from GitHub OAuth App
#   GITHUB_CLIENT_SECRET      — from GitHub OAuth App
#   GOOGLE_CLIENT_ID          — from Google Cloud OAuth 2.0 Client
#   GOOGLE_CLIENT_SECRET      — from Google Cloud OAuth 2.0 Client
#   STRIPE_API_KEY            — Stripe secret key (sk_live_… in prod)
#   STRIPE_WEBHOOK_SECRET     — Stripe webhook signing secret (whsec_…), live environment
#   STRIPE_PRICE_REMOVE_ADS   — Stripe Price ID for the remove-ads product
#   STRIPE_PRICE_CREDITS_10   — Stripe Price ID for 10 credits
#   STRIPE_PRICE_CREDITS_100  — Stripe Price ID for 100 credits
#   STRIPE_PRICE_CREDITS_1000 — Stripe Price ID for 1000 credits
#   TRIPO_API_KEY             — Tripo AI API key (https://platform.tripo3d.ai); never commit it
#   TRIPO_MCP_TOKEN           — random bearer secret gating /api/tripo-mcp (dev tool, not player-facing)
#
# pocketrpg-tripo-assets is a plain R2 bucket (no special config) — create it once with
# `wrangler r2 bucket create pocketrpg-tripo-assets` (and the -preview one below).
#
# Pre-step-3 the four STRIPE_PAYMENT_LINK_* secrets pointed at public
# Stripe Payment Links and clients passed ?client_reference_id=… on
# them. That path was retired in favour of server-issued Checkout
# Sessions; the old secrets can be deleted from the Pages dashboard
# once a deploy with this code is live.

[env.preview]
d1_databases = [
  { binding = "DB", database_name = "pocketrpg-preview", database_id = "59233295-f492-4113-94da-90034d84a6a4" }
]
r2_buckets = [
  { binding = "TRIPO_ASSETS", bucket_name = "pocketrpg-tripo-assets-preview" }
]
vars = { APP_BASE_URL = "https://preview.pocketrpg.pages.dev" }
ai = { binding = "AI" }
# Secrets for preview environment (set via `wrangler pages secret put --env preview`):
#   STRIPE_API_KEY            — Stripe secret key (sk_test_…)
#   STRIPE_WEBHOOK_SECRET     — Stripe webhook signing secret (whsec_…), test environment
#   STRIPE_PRICE_REMOVE_ADS   — test Stripe Price ID
#   STRIPE_PRICE_CREDITS_10   — test Stripe Price ID
#   STRIPE_PRICE_CREDITS_100  — test Stripe Price ID
#   STRIPE_PRICE_CREDITS_1000 — test Stripe Price ID
#   TRIPO_API_KEY             — Tripo AI API key (can reuse the same key as production)
#   TRIPO_MCP_TOKEN           — random bearer secret gating /api/tripo-mcp on preview
