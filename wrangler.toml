name = "pocketrpg"
compatibility_date = "2025-01-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "pocketrpg"
database_id = "439e810b-8dce-4697-94c2-a7392520ad8f"

[[r2_buckets]]
binding = "TRIPO_ASSETS"
bucket_name = "pocketrpg-assets"

# Co-op boss rooms. The class is defined in the pocketrpg-world Worker
# (world/server/CoopBossRoom.ts) because a Pages project cannot export a Durable
# Object class — `script_name` is what binds across the two deployments.
#
# Consequence worth knowing: co-op bossing now needs pocketrpg-world deployed.
# A missing binding is handled (functions/_lib/game/coopRoom.js returns
# COOP_UNAVAILABLE and the picker says group fights are offline) rather than
# throwing, so a Pages-only deploy degrades instead of breaking the screen.
[[durable_objects.bindings]]
name = "COOP_ROOM"
class_name = "CoopBossRoom"
script_name = "pocketrpg-world"

[ai]
binding = "AI"

[vars]
APP_BASE_URL = "https://pocketrpg.co.uk"
# Feature flag for the chat helper's 1-credit write-action fee (CHAT_ACTION_FEE
# in functions/_lib/chat/actions.js). "false" disables it; the fee logic stays
# in place untouched, so flipping this back to "true" (or removing it — unset
# defaults to enabled) re-enables charging without a code change.
CHAT_ACTION_FEE_ENABLED = "false"

# NOTE: the 3D-render feature flag is BUILD-time, not a runtime binding.
# build_single.cjs derives it from CF_PAGES_BRANCH (injected by Pages into
# every build): non-main branch = preview = 3D on, main = production = off.
# Set `Enable3dRender` ("true"/"false") in the build env only to override.
# It bakes into the game chunk as `pocketEnable3D`; listing it under [vars]
# would have no effect.

# Secrets to set via dashboard or `wrangler pages secret put`:
#   JWT_SECRET                — random 32+ byte string used to sign session JWTs
#   ADMIN_SECRET              — random 32+ byte string; the ONLY credential for
#                               the /admin portal and /api/admin/grant-item.
#                               Minimum 16 chars — shorter (or unset) denies all.
#   GITHUB_CLIENT_ID          — from GitHub OAuth App
#   GITHUB_CLIENT_SECRET      — from GitHub OAuth App
#   GOOGLE_CLIENT_ID          — from Google Cloud OAuth 2.0 Client
#   GOOGLE_CLIENT_SECRET      — from Google Cloud OAuth 2.0 Client
#   STRIPE_API_KEY            — Stripe secret key (sk_live_… in prod)
#   STRIPE_WEBHOOK_SECRET     — Stripe webhook signing secret (whsec_…), live environment
#   STRIPE_PRICE_REMOVE_ADS   — Stripe Price ID for the remove-ads product
#   STRIPE_PRICE_CREDITS_10   — Stripe Price ID for 10 credits
#   STRIPE_PRICE_CREDITS_100  — Stripe Price ID for 100 credits
#   STRIPE_PRICE_CREDITS_1000 — Stripe Price ID for 1000 credits
#
# pocketrpg-assets is a plain R2 bucket (no special config) — create it once with
# `wrangler r2 bucket create pocketrpg-assets` (and the -preview one below).
#
# Pre-step-3 the four STRIPE_PAYMENT_LINK_* secrets pointed at public
# Stripe Payment Links and clients passed ?client_reference_id=… on
# them. That path was retired in favour of server-issued Checkout
# Sessions; the old secrets can be deleted from the Pages dashboard
# once a deploy with this code is live.

[env.preview]
d1_databases = [
  { binding = "DB", database_name = "pocketrpg-preview", database_id = "59233295-f492-4113-94da-90034d84a6a4" }
]
r2_buckets = [
  { binding = "TRIPO_ASSETS", bucket_name = "pocketrpg-assets-preview" }
]
durable_objects = { bindings = [
  { name = "COOP_ROOM", class_name = "CoopBossRoom", script_name = "pocketrpg-world-preview" }
] }
# DISABLE_QUEST_REQUIREMENTS is preview-ONLY and must never appear in the
# production [vars] block above — it bypasses every quest gate so testers can
# reach quest-locked content. src/engine/questGates.js refuses it on the
# production hostnames as a second lock, and tests/questGateProduction.test.ts
# fails the build if it ever lands in production vars.
vars = { APP_BASE_URL = "https://preview.pocketrpg.pages.dev", CHAT_ACTION_FEE_ENABLED = "false", DISABLE_QUEST_REQUIREMENTS = "true" }
ai = { binding = "AI" }
# Secrets for preview environment (set via `wrangler pages secret put --env preview`):
#   ADMIN_SECRET              — deliberately NOT set here. /admin exists on every
#                               preview URL too, and an unset secret denies every
#                               request. If preview ever needs it, give it its own
#                               value — never reuse production's.
#   STRIPE_API_KEY            — Stripe secret key (sk_test_…)
#   STRIPE_WEBHOOK_SECRET     — Stripe webhook signing secret (whsec_…), test environment
#   STRIPE_PRICE_REMOVE_ADS   — test Stripe Price ID
#   STRIPE_PRICE_CREDITS_10   — test Stripe Price ID
#   STRIPE_PRICE_CREDITS_100  — test Stripe Price ID
#   STRIPE_PRICE_CREDITS_1000 — test Stripe Price ID
