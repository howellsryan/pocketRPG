<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PocketRPG World — Terrain Preview</title>
    <style>
      html, body { margin: 0; height: 100%; background: #10130d; overflow: hidden; font-family: system-ui, sans-serif; }
      #host { position: fixed; inset: 0; }
      #hud {
        position: fixed; top: 10px; left: 10px; z-index: 10;
        background: rgba(0,0,0,0.55); color: #e8e6da; padding: 8px 10px;
        border-radius: 8px; font-size: 13px; line-height: 1.5;
      }
      #hud select { font-size: 13px; margin-top: 4px; }
      #hud .meta { opacity: 0.75; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <div id="hud">
      <div><strong>Terrain preview</strong> — drag to orbit, wheel to zoom</div>
      <label>Zone: <select id="zoneSel"></select></label>
      <div class="meta" id="meta"></div>
    </div>
    <script type="module" src="/src/preview/main.ts"></script>
  </body>
</html>
