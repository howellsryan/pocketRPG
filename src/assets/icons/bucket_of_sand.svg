<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bos_bucket" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#d4a84b"/><stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <linearGradient id="bos_sand" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f0d890"/><stop offset="0.6" stop-color="#d4b84a"/><stop offset="1" stop-color="#a8862a"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
    <!-- Handle arc -->
    <path d="M 196 178 A 80 60 0 0 1 316 178" fill="none" stroke="#8a6420" stroke-width="14"/>
    <!-- Bucket body (trapezoid) -->
    <path d="M 172 196 L 340 196 L 316 390 L 196 390 Z" fill="url(#bos_bucket)" stroke-width="13"/>
    <!-- Sand fill at top -->
    <ellipse cx="256" cy="196" rx="84" ry="20" fill="url(#bos_sand)" stroke-width="11"/>
    <!-- Sand texture -->
    <path d="M 210 185 Q 240 178 270 185 Q 250 190 230 188 Z" fill="#f8e8b0" stroke="none" opacity="0.6"/>
    <!-- Bucket rim highlight -->
    <path d="M 180 196 L 336 196" stroke="#e8c060" stroke-width="7" fill="none" opacity="0.5"/>
    <!-- Bucket shading line -->
    <path d="M 220 210 L 208 380" stroke="#6a4410" stroke-width="6" fill="none" opacity="0.35"/>
  </g>
</svg>
