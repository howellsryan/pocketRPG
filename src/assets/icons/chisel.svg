<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="chi_handle" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#c89040"/><stop offset="1" stop-color="#7a5018"/>
    </linearGradient>
    <linearGradient id="chi_blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e0dcd0"/><stop offset="0.5" stop-color="#c0bcac"/><stop offset="1" stop-color="#808070"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
    <!-- Handle (vertical, upper portion) -->
    <rect x="228" y="120" width="56" height="168" rx="10" fill="url(#chi_handle)" stroke-width="13"/>
    <!-- Handle ferrule (metal ring) -->
    <rect x="222" y="268" width="68" height="22" rx="4" fill="#c0c0b0" stroke-width="10"/>
    <!-- Blade body -->
    <rect x="238" y="290" width="36" height="98" fill="url(#chi_blade)" stroke-width="12"/>
    <!-- Chisel bevel tip -->
    <path d="M 238 388 L 256 418 L 274 388 Z" fill="#d0ccc0" stroke-width="11"/>
    <!-- Handle wood grain -->
    <path d="M 236 148 L 236 280" stroke="#7a5018" stroke-width="5" fill="none" opacity="0.35"/>
    <path d="M 264 140 L 264 278" stroke="#7a5018" stroke-width="4" fill="none" opacity="0.28"/>
    <!-- Blade highlight -->
    <path d="M 244 296 L 244 386" stroke="#f0ece0" stroke-width="6" fill="none" opacity="0.5"/>
    <!-- Top cap -->
    <rect x="224" y="112" width="64" height="16" rx="6" fill="#d0a050" stroke-width="10"/>
  </g>
</svg>
