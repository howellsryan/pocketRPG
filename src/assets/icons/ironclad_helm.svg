    <circle cx="180" cy="260" r="8" fill="#d8e4f0" stroke="#1a1410" stroke-width="5"/>
    <circle cx="180" cy="320" r="8" fill="#d8e4f0" stroke="#1a1410" stroke-width="5"/>
    <circle cx="332" cy="200" r="8" fill="#d8e4f0" stroke="#1a1410" stroke-width="5"/>
    <circle cx="332" cy="260" r="8" fill="#d8e4f0" stroke="#1a1410" stroke-width="5"/>
    <circle cx="332" cy="320" r="8" fill="#d8e4f0" stroke="#1a1410" stroke-width="5"/>
    <!-- Center ridge -->
    <path d="M 256 94 L 256 392" stroke="#b4c4d4" stroke-width="7" fill="none"/>
    <!-- Brow plate overhang -->
