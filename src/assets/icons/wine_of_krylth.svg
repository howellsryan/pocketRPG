    <path d="M 196 284 C 186 256 186 206 194 192 L 318 192 C 326 206 326 256 316 284 L 316 390 C 316 406 302 418 256 418 C 210 418 196 406 196 390 Z" fill="url(#wok_bottle)" stroke-width="13"/>
