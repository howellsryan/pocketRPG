      <stop offset="0" stop-color="#9040c0"/><stop offset="0.6" stop-color="#601090"/><stop offset="1" stop-color="#380060"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
