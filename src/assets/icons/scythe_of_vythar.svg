<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="scythe_of_vythar_blade" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#eef2f6"/><stop offset="0.5" stop-color="#aab2bc"/><stop offset="1" stop-color="#5a626c"/>
    </linearGradient>
    <linearGradient id="scythe_of_vythar_snath" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2a1c20"/><stop offset="1" stop-color="#140c10"/>
    </linearGradient>
  </defs>
  <g stroke="#0e0808" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Snath (curved pole) -->
    <path d="M150 466 C 210 380 300 250 350 138" fill="none" stroke="url(#scythe_of_vythar_snath)" stroke-width="30"/>
    <!-- Bone-white grip cap at the foot -->
    <circle cx="150" cy="466" r="18" fill="#d8d2c2"/>
    <!-- Crimson bindings on the snath -->
    <path d="M232 348 L258 364 M280 286 L306 302" stroke="#c0241a" stroke-width="11" fill="none"/>
    <!-- Great curved blade sweeping from the top of the snath -->
    <path d="M348 142 C 244 56 116 56 48 150 C 130 116 232 132 320 196 C 338 178 348 160 348 142 Z" fill="url(#scythe_of_vythar_blade)"/>
    <!-- Glowing crimson cutting edge -->
    <path d="M348 142 C 244 56 116 56 48 150" fill="none" stroke="#e0301a" stroke-width="9"/>
    <!-- Socket joining blade to snath -->
    <circle cx="346" cy="150" r="20" fill="#3a2a2e" stroke="#0e0808" stroke-width="10"/>
    <circle cx="344" cy="146" r="8" fill="#c0241a" stroke="none"/>
  </g>
</svg>
