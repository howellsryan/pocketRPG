<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fr_rod" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#c89040"/><stop offset="0.5" stop-color="#9a7030"/><stop offset="1" stop-color="#d4b060"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
    <!-- Rod shaft (diagonal) -->
    <path d="M 140 400 L 420 108" stroke="url(#fr_rod)" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Reel (circle on handle) -->
    <circle cx="182" cy="360" r="32" fill="#909080" stroke-width="12"/>
    <circle cx="182" cy="360" r="16" fill="#606050" stroke-width="9"/>
    <!-- Reel handle -->
    <path d="M 214 340 L 232 320" stroke="#909080" stroke-width="11" fill="none"/>
    <circle cx="234" cy="316" r="10" fill="#808070" stroke-width="9"/>
    <!-- Line guides (small rings along rod) -->
    <circle cx="260" cy="300" r="8" fill="none" stroke="#c0c0b0" stroke-width="8"/>
    <circle cx="320" cy="236" r="7" fill="none" stroke="#c0c0b0" stroke-width="7"/>
    <circle cx="376" cy="174" r="6" fill="none" stroke="#c0c0b0" stroke-width="6"/>
    <!-- Fishing line -->
    <path d="M 420 108 C 444 90 452 140 440 190 C 432 226 420 250 418 280" stroke="#e8e0c8" stroke-width="5" fill="none" opacity="0.7"/>
    <!-- Hook at end of line -->
    <path d="M 418 280 C 426 300 416 320 404 316 C 394 312 392 300 398 292" stroke="#c0c0b0" stroke-width="8" fill="none"/>
  </g>
</svg>
