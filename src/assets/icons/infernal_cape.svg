<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="infernal_cape_body" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#2a1a28"/><stop offset="0.5" stop-color="#180f14"/><stop offset="1" stop-color="#0a060a"/>
    </linearGradient>
    <linearGradient id="infernal_cape_lava" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#ff6a10"/><stop offset="0.6" stop-color="#cc2200"/><stop offset="1" stop-color="#6a0a00"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cape body — very dark near-black -->
    <path d="M 158 80 C 140 80 128 90 122 100 L 88 420 Q 180 456 256 456 Q 332 456 424 420 L 390 100 C 384 90 372 80 354 80 Z" fill="url(#infernal_cape_body)"/>
    <!-- Collar at top -->
    <path d="M 158 80 L 354 80 L 340 110 L 256 120 L 172 110 Z" fill="#3a1820" stroke="#1a1410" stroke-width="11"/>
    <!-- Lava cracks running through cape -->
    <path d="M 180 160 C 170 220 190 280 168 380" stroke="url(#infernal_cape_lava)" stroke-width="10" fill="none"/>
    <path d="M 180 160 C 200 200 188 240 210 280 C 220 310 205 350 210 400" stroke="url(#infernal_cape_lava)" stroke-width="8" fill="none"/>
    <path d="M 256 140 C 250 200 268 260 252 360 C 248 390 256 420 254 440" stroke="url(#infernal_cape_lava)" stroke-width="12" fill="none"/>
    <path d="M 332 160 C 342 220 322 280 344 380" stroke="url(#infernal_cape_lava)" stroke-width="10" fill="none"/>
    <path d="M 332 160 C 312 200 324 240 302 280 C 292 310 307 350 302 400" stroke="url(#infernal_cape_lava)" stroke-width="8" fill="none"/>
    <!-- Cross veins -->
    <path d="M 180 220 C 220 210 290 214 332 220" stroke="url(#infernal_cape_lava)" stroke-width="6" fill="none"/>
    <path d="M 174 310 C 220 300 292 304 338 310" stroke="url(#infernal_cape_lava)" stroke-width="6" fill="none"/>
    <!-- Bright lava glow dots at junctions -->
    <circle cx="256" cy="260" r="14" fill="#ff8c2a" stroke="none"/>
    <circle cx="256" cy="260" r="7" fill="#ffdd44" stroke="none"/>
    <!-- Clasp -->
    <circle cx="256" cy="95" r="16" fill="#cc2200" stroke="#8a0a00" stroke-width="8"/>
    <circle cx="254" cy="92" r="7" fill="#ff6a10" stroke="none"/>
  </g>
</svg>
