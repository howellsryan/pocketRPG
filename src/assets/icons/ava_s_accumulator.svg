<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ava_s_accumulator_body" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#8a7a5a"/><stop offset="0.5" stop-color="#5a4e36"/><stop offset="1" stop-color="#2e2818"/>
    </linearGradient>
    <linearGradient id="ava_s_accumulator_patch" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6fa04a"/><stop offset="1" stop-color="#3a6020"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cape body — brown/tan -->
    <path d="M 158 80 C 140 80 128 90 122 100 L 88 420 Q 180 456 256 456 Q 332 456 424 420 L 390 100 C 384 90 372 80 354 80 Z" fill="url(#ava_s_accumulator_body)"/>
    <!-- Collar -->
    <path d="M 158 80 L 354 80 L 340 110 L 256 120 L 172 110 Z" fill="#5a4030" stroke="#1a1410" stroke-width="11"/>
    <!-- Green nature patch in centre -->
    <ellipse cx="256" cy="280" rx="80" ry="80" fill="url(#ava_s_accumulator_patch)"/>
    <!-- Arrow design in the patch -->
    <path d="M 210 280 L 270 250 L 260 280 L 310 280 L 260 280 L 270 310 Z" fill="#c9a24a" stroke="#8a6010" stroke-width="7"/>
    <!-- Stitch lines on cape panels -->
    <path d="M 188 160 C 186 260 190 360 188 430" stroke="#3a2e1c" stroke-width="5" stroke-dasharray="8 12" fill="none"/>
    <path d="M 324 160 C 326 260 322 360 324 430" stroke="#3a2e1c" stroke-width="5" stroke-dasharray="8 12" fill="none"/>
    <!-- Clasp -->
    <circle cx="256" cy="95" r="14" fill="#c9a24a" stroke="#8a6010" stroke-width="8"/>
    <circle cx="254" cy="92" r="6" fill="#fff0a0" stroke="none"/>
  </g>
</svg>
