<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="robin_hood_hat_b" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#90a870"/><stop offset="0.55" stop-color="#526a38"/><stop offset="1" stop-color="#263218"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Wide brim on left, upturned on right (classic tilted ranger hat) -->
    <!-- Hat body - forward-tilted cone -->
    <path d="M 256 98 C 250 98 238 108 228 126 L 182 286 C 230 270 296 274 340 290 L 286 126 C 274 108 262 98 256 98 Z" fill="url(#robin_hood_hat_b)"/>
    <!-- Wide brim -->
    <path d="M 120 290 C 180 332 332 332 400 290 C 400 316 388 330 356 338 C 298 350 214 350 166 338 C 134 330 120 316 120 290 Z" fill="#3a4a22"/>
    <!-- Brim top surface -->
    <path d="M 120 290 C 180 308 332 308 400 290 C 370 280 296 272 256 272 C 216 272 150 278 120 290 Z" fill="url(#robin_hood_hat_b)"/>
    <!-- Feather in hat band (iconic detail) -->
    <path d="M 290 282 C 320 260 360 230 380 180 C 364 200 344 228 310 256 C 340 220 356 190 362 160 C 344 188 320 220 290 250 Z" fill="#f0e8d0" stroke="#c9a24a" stroke-width="7"/>
    <!-- Hat band -->
    <path d="M 168 280 C 206 268 308 268 344 280 L 340 292 C 304 282 208 282 172 292 Z" fill="#c9a24a"/>
    <!-- Highlight -->
    <path d="M 238 118 C 228 170 218 240 218 284" stroke="#90a870" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
</svg>
