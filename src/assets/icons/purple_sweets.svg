<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ps_sweet" cx="0.35" cy="0.3" r="0.65">
      <stop offset="0" stop-color="#e080e0"/><stop offset="0.5" stop-color="#a040a8"/><stop offset="1" stop-color="#5a1068"/>
    </radialGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
    <!-- Three sweets in a pile -->
    <!-- Back-left sweet -->
    <ellipse cx="194" cy="300" rx="62" ry="50" fill="url(#ps_sweet)" stroke-width="11" opacity="0.85"/>
    <ellipse cx="178" cy="286" rx="18" ry="12" fill="#f0a0f0" stroke="none" opacity="0.5"/>
    <!-- Back-right sweet -->
    <ellipse cx="318" cy="296" rx="60" ry="48" fill="url(#ps_sweet)" stroke-width="11" opacity="0.85"/>
    <ellipse cx="302" cy="282" rx="16" ry="11" fill="#f0a0f0" stroke="none" opacity="0.5"/>
    <!-- Front-center sweet (biggest) -->
    <ellipse cx="256" cy="320" rx="70" ry="56" fill="url(#ps_sweet)" stroke-width="12"/>
    <ellipse cx="236" cy="302" rx="22" ry="15" fill="#f0a0f0" stroke="none" opacity="0.55"/>
    <!-- Twist wrapper on front sweet -->
    <path d="M 188 316 C 200 296 222 292 240 296" stroke="#c860c8" stroke-width="9" fill="none" opacity="0.6"/>
    <path d="M 272 296 C 290 292 310 296 324 316" stroke="#c860c8" stroke-width="9" fill="none" opacity="0.6"/>
    <!-- Wrapper tails on sides -->
    <path d="M 188 316 C 172 308 158 314 152 322" stroke="#d070d0" stroke-width="10" fill="none"/>
    <path d="M 324 316 C 340 308 354 314 360 322" stroke="#d070d0" stroke-width="10" fill="none"/>
    <!-- Sugar sparkle -->
    <path d="M 244 272 L 248 262 L 252 272 L 248 262 L 258 266" stroke="#f8d0f8" stroke-width="6" fill="none" opacity="0.7"/>
