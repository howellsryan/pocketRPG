<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="dkt_body" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#486898"/><stop offset="0.5" stop-color="#2a4070"/><stop offset="1" stop-color="#102038"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
    <!-- Tentacle body (thick, coiling) -->
    <path d="M 180 436 C 172 388 186 332 216 286 C 240 250 270 232 296 220 C 330 204 356 196 364 178 C 372 158 356 136 334 130" fill="none" stroke="url(#dkt_body)" stroke-width="44" stroke-linecap="round"/>
    <!-- Tentacle tip (tapering) -->
    <path d="M 334 130 C 324 118 314 106 316 94 C 318 84 326 80 334 86" fill="none" stroke="#2a4070" stroke-width="28" stroke-linecap="round"/>
    <path d="M 334 86 C 336 78 336 70 332 66" fill="none" stroke="#1a2a50" stroke-width="16" stroke-linecap="round"/>
    <!-- Suckers along tentacle (circles on underside) -->
    <circle cx="224" cy="290" r="14" fill="#1e3060" stroke-width="9"/>
    <circle cx="246" cy="262" r="13" fill="#1e3060" stroke-width="9"/>
    <circle cx="268" cy="238" r="12" fill="#1e3060" stroke-width="9"/>
    <circle cx="296" cy="218" r="11" fill="#1e3060" stroke-width="8"/>
    <circle cx="324" cy="202" r="10" fill="#1e3060" stroke-width="8"/>
    <circle cx="348" cy="190" r="9" fill="#1e3060" stroke-width="8"/>
    <!-- Sucker highlights -->
    <circle cx="220" cy="286" r="5" fill="#5080b0" stroke="none" opacity="0.5"/>
    <circle cx="244" cy="258" r="4" fill="#5080b0" stroke="none" opacity="0.5"/>
    <!-- Dripping ink/water -->
    <path d="M 192 404 C 188 420 192 436 190 450" stroke="#102038" stroke-width="8" fill="none" opacity="0.5"/>
    <!-- Bio-luminescence glow -->
    <path d="M 270 240 C 276 228 288 224 296 228" stroke="#80c0f8" stroke-width="6" fill="none" opacity="0.4"/>
  </g>
</svg>
