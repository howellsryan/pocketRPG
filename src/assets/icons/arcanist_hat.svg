    <path d="M 222 180 L 228 166 L 234 180 L 248 186 L 234 192 L 228 206 L 222 192 L 208 186 Z" fill="#e8c0ff" stroke="#6030a0" stroke-width="5"/>
    <path d="M 272 280 L 276 270 L 280 280 L 290 284 L 280 288 L 276 298 L 272 288 L 262 284 Z" fill="#e8c0ff" stroke="#6030a0" stroke-width="4"/>
