<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ban_body" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#f8e840"/><stop offset="0.5" stop-color="#e8c820"/><stop offset="1" stop-color="#c89010"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
    <!-- Banana curved shape -->
    <path d="M 148 390 C 140 342 154 278 196 228 C 232 184 288 158 338 148" fill="none" stroke="url(#ban_body)" stroke-width="54" stroke-linecap="round"/>
    <!-- Outer edge (darker) for thickness -->
    <path d="M 148 390 C 140 342 154 278 196 228 C 232 184 288 158 338 148" fill="none" stroke="#1a1410" stroke-width="60" stroke-linecap="round" opacity="0.0"/>
    <!-- Ridge line on top of banana -->
    <path d="M 162 374 C 156 326 170 264 212 214 C 248 172 302 148 348 140" fill="none" stroke="#e8b010" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <!-- Tip caps -->
    <circle cx="150" cy="388" r="18" fill="#c07808" stroke-width="11"/>
    <circle cx="340" cy="146" r="16" fill="#c07808" stroke-width="11"/>
    <!-- Highlight strip -->
    <path d="M 176 358 C 172 312 186 252 228 204 C 260 168 308 148 346 142" fill="none" stroke="#fff8a0" stroke-width="10" stroke-linecap="round" opacity="0.35"/>
  </g>
</svg>
