<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="pof_pot" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#d8c8a8"/><stop offset="0.6" stop-color="#b4a07a"/><stop offset="1" stop-color="#7a6840"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
    <!-- Pot body -->
    <path d="M 196 220 L 316 220 L 334 390 L 178 390 Z" fill="url(#pof_pot)" stroke-width="13"/>
    <!-- Pot rim -->
    <ellipse cx="256" cy="220" rx="60" ry="14" fill="#c8b890" stroke-width="11"/>
    <!-- Flour fill (white mound above rim) -->
    <ellipse cx="256" cy="206" rx="62" ry="22" fill="#f8f4ec" stroke-width="10"/>
    <path d="M 196 202 C 216 186 240 180 256 182 C 272 180 296 186 316 202" fill="#fffefa" stroke="#c8c0b0" stroke-width="8"/>
    <!-- Flour dust puff -->
    <ellipse cx="230" cy="182" rx="18" ry="10" fill="#fffefa" stroke="#c8c0b0" stroke-width="6" opacity="0.7"/>
    <ellipse cx="278" cy="176" rx="14" ry="8" fill="#fffefa" stroke="#c8c0b0" stroke-width="5" opacity="0.6"/>
    <!-- Pot shading line -->
    <path d="M 224 232 L 216 376" stroke="#7a6840" stroke-width="6" fill="none" opacity="0.35"/>
  </g>
</svg>
