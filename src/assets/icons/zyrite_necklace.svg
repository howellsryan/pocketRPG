<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="zyrite_necklace_crystal" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#6a3040"/><stop offset="0.5" stop-color="#3a2028"/><stop offset="1" stop-color="#1a1014"/>
    </linearGradient>
    <radialGradient id="zyrite_necklace_glow" cx="0.4" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#6a3040" stop-opacity="0.6"/><stop offset="1" stop-color="#1a1014" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Chain — dark reddish -->
    <path d="M256 96 C 176 116 128 178 128 250" fill="none" stroke="#6a3040" stroke-width="15"/>
    <path d="M256 96 C 336 116 384 178 384 250" fill="none" stroke="#6a3040" stroke-width="15"/>
    <!-- Dark glow -->
    <ellipse cx="256" cy="350" rx="110" ry="110" fill="url(#zyrite_necklace_glow)" stroke="none"/>
    <!-- Crystal faceted hexagon -->
    <path d="M 256 252 L 320 292 L 320 368 L 256 420 L 192 368 L 192 292 Z" fill="url(#zyrite_necklace_crystal)" stroke="#6a3040" stroke-width="11"/>
    <!-- Facet division lines -->
    <path d="M 256 252 L 256 420" stroke="#6a3040" stroke-width="7" fill="none"/>
    <path d="M 192 292 L 320 292" stroke="#6a3040" stroke-width="7" fill="none"/>
    <path d="M 192 368 L 320 368" stroke="#6a3040" stroke-width="6" fill="none"/>
    <!-- Top highlight facet -->
    <path d="M 256 258 L 298 286 L 272 286 Z" fill="#6a3040" stroke="none" opacity="0.8"/>
    <!-- Inner glow core -->
    <circle cx="256" cy="336" r="20" fill="#6a3040" stroke="none" opacity="0.6"/>
    <!-- Mount loop -->
    <ellipse cx="256" cy="252" rx="20" ry="14" fill="#9060d0" stroke="#1a1410" stroke-width="10"/>
  </g>
