<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="infernal_max_cape_body" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1e0e0a"/><stop offset="0.5" stop-color="#100608"/><stop offset="1" stop-color="#060208"/>
    </linearGradient>
    <radialGradient id="infernal_max_cape_glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#ff8c2a"/><stop offset="0.45" stop-color="#cc2200" stop-opacity="0.8"/><stop offset="1" stop-color="#6a0a00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cape body -->
    <path d="M 158 80 C 140 80 128 90 122 100 L 88 420 Q 180 456 256 456 Q 332 456 424 420 L 390 100 C 384 90 372 80 354 80 Z" fill="url(#infernal_max_cape_body)"/>
