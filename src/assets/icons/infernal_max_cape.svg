    <!-- Gold trim on edges -->
    <path d="M 122 100 L 88 420 Q 180 456 256 456" stroke="#c9a24a" stroke-width="9" fill="none"/>
    <path d="M 390 100 L 424 420 Q 332 456 256 456" stroke="#c9a24a" stroke-width="9" fill="none"/>
    <!-- Lava cracks -->
    <path d="M 180 150 C 174 220 188 280 172 370" stroke="#ff6a10" stroke-width="8" fill="none"/>
    <path d="M 332 150 C 338 220 324 280 340 370" stroke="#ff6a10" stroke-width="8" fill="none"/>
    <path d="M 174 260 C 220 250 292 254 338 260" stroke="#ff6a10" stroke-width="6" fill="none"/>
    <!-- Infernal glow at centre (replacing max-cape star) -->
    <ellipse cx="256" cy="280" rx="100" ry="100" fill="url(#infernal_max_cape_glow)" stroke="none"/>
    <!-- Central sun-like symbol -->
    <circle cx="256" cy="278" r="28" fill="#ff8c2a" stroke="#c93a00" stroke-width="8"/>
    <circle cx="256" cy="278" r="16" fill="#ffdd44" stroke="none"/>
    <circle cx="254" cy="274" r="7" fill="#ffffff" stroke="none"/>
    <!-- Rays -->
    <path d="M 256 244 L 256 230 M 256 312 L 256 328 M 220 278 L 206 278 M 292 278 L 306 278 M 231 253 L 221 243 M 281 303 L 291 313 M 281 253 L 291 243 M 231 303 L 221 313" stroke="#ff8c2a" stroke-width="7" fill="none"/>
    <!-- Clasp -->
    <circle cx="256" cy="95" r="18" fill="#cc2200" stroke="#8a0a00" stroke-width="8"/>
    <circle cx="254" cy="92" r="8" fill="#ff8c2a" stroke="none"/>
  </g>
