<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ava_s_assembler_body" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#3a1212"/><stop offset="0.5" stop-color="#200a0a"/><stop offset="1" stop-color="#0c0404"/>
    </linearGradient>
  </defs>
  <g stroke="#160808" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Arrows sticking out of the top of the pack -->
    <g>
      <!-- left arrow -->
      <line x1="196" y1="230" x2="150" y2="70" stroke="#3a2a2a" stroke-width="11"/>
      <path d="M150 70 L132 104 L168 104 Z" fill="#c0392b" stroke="#160808" stroke-width="9"/>
      <path d="M210 224 L196 232 M204 248 L190 256" stroke="#c0392b" stroke-width="9"/>
      <!-- centre arrow -->
      <line x1="256" y1="230" x2="256" y2="58" stroke="#3a2a2a" stroke-width="11"/>
      <path d="M256 46 L236 84 L276 84 Z" fill="#c0392b" stroke="#160808" stroke-width="9"/>
      <path d="M272 226 L256 234 M272 250 L256 258" stroke="#c0392b" stroke-width="9"/>
      <!-- right arrow -->
      <line x1="316" y1="230" x2="362" y2="70" stroke="#3a2a2a" stroke-width="11"/>
      <path d="M362 70 L344 104 L380 104 Z" fill="#c0392b" stroke="#160808" stroke-width="9"/>
      <path d="M302 224 L316 232 M308 248 L322 256" stroke="#c0392b" stroke-width="9"/>
    </g>
    <!-- Backpack main body -->
    <path d="M150 226 Q150 196 182 194 L330 194 Q362 196 362 226 L370 420 Q370 454 336 454 L176 454 Q142 454 142 420 Z" fill="url(#ava_s_assembler_body)"/>
    <!-- Front flap -->
    <path d="M150 232 Q256 206 362 232 L356 320 Q256 296 156 320 Z" fill="#2a0e0e" stroke="#160808" stroke-width="11"/>
    <!-- Red trim along the flap -->
    <path d="M156 320 Q256 296 356 320" stroke="#c0392b" stroke-width="7" fill="none"/>
    <!-- Buckle -->
    <rect x="236" y="296" width="40" height="44" rx="9" fill="#c0392b" stroke="#160808" stroke-width="8"/>
    <circle cx="256" cy="318" r="9" fill="#3a1212" stroke="none"/>
    <!-- Side straps -->
    <path d="M150 360 L142 360 M362 360 L370 360" stroke="#c0392b" stroke-width="10"/>
  </g>
</svg>
