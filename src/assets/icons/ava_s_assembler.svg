<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ava_s_assembler_body" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#4a5a8a"/><stop offset="0.5" stop-color="#2a3860"/><stop offset="1" stop-color="#141a30"/>
    </linearGradient>
    <radialGradient id="ava_s_assembler_jewel" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#a8e0ff"/><stop offset="0.6" stop-color="#3a8ad0"/><stop offset="1" stop-color="#1a4a8a"/>
    </radialGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cape body — deep blue-purple -->
    <path d="M 158 80 C 140 80 128 90 122 100 L 88 420 Q 180 456 256 456 Q 332 456 424 420 L 390 100 C 384 90 372 80 354 80 Z" fill="url(#ava_s_assembler_body)"/>
    <!-- Collar -->
    <path d="M 158 80 L 354 80 L 340 110 L 256 120 L 172 110 Z" fill="#2a3060" stroke="#1a1410" stroke-width="11"/>
    <!-- Blue jewel at center -->
    <ellipse cx="256" cy="278" rx="56" ry="56" fill="url(#ava_s_assembler_jewel)" stroke="#1a3a7a" stroke-width="10"/>
    <!-- Arrow pointing upward in gem -->
    <path d="M 256 242 L 278 282 L 264 278 L 264 318 L 248 318 L 248 278 L 234 282 Z" fill="#c8e8ff" stroke="none"/>
    <!-- Trim on edges -->
    <path d="M 122 100 L 88 420 Q 180 456 256 456" stroke="#5a8ad0" stroke-width="7" fill="none"/>
    <path d="M 390 100 L 424 420 Q 332 456 256 456" stroke="#5a8ad0" stroke-width="7" fill="none"/>
    <!-- Specular highlight on cape -->
    <path d="M 170 160 C 162 250 168 340 162 420" stroke="#7a9ad8" stroke-width="6" fill="none" opacity="0.5"/>
    <!-- Clasp -->
    <circle cx="256" cy="95" r="16" fill="#3a8ad0" stroke="#1a4a8a" stroke-width="8"/>
    <circle cx="254" cy="92" r="7" fill="#a8e0ff" stroke="none"/>
  </g>
</svg>
