<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="spiked_manacles_band" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5a5a62"/><stop offset="0.5" stop-color="#2e2e36"/><stop offset="1" stop-color="#141418"/>
    </linearGradient>
    <radialGradient id="spiked_manacles_rivet" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#9a9aaa"/><stop offset="1" stop-color="#3a3a42"/>
    </radialGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main band ring (ankle shackle) -->
    <ellipse cx="256" cy="320" rx="148" ry="52" fill="none" stroke="url(#spiked_manacles_band)" stroke-width="52"/>
    <ellipse cx="256" cy="308" rx="108" ry="28" fill="none" stroke="#3a3a3e" stroke-width="6"/>
    <!-- Hinge block on right -->
    <rect x="374" y="292" width="36" height="56" rx="6" fill="url(#spiked_manacles_band)"/>
    <!-- Lock clasp on left -->
    <rect x="100" y="296" width="30" height="48" rx="6" fill="url(#spiked_manacles_band)"/>
    <rect x="104" y="308" width="22" height="24" rx="4" fill="#1a1a20"/>
    <!-- Spikes protruding from top of band -->
    <path d="M 160 276 L 154 228 L 172 272 Z" fill="#7a7a88" stroke="#1a1410" stroke-width="10"/>
    <path d="M 208 264 L 204 212 L 220 260 Z" fill="#7a7a88" stroke="#1a1410" stroke-width="10"/>
    <path d="M 256 260 L 252 206 L 268 256 Z" fill="#7a7a88" stroke="#1a1410" stroke-width="10"/>
    <path d="M 304 264 L 300 212 L 316 260 Z" fill="#7a7a88" stroke="#1a1410" stroke-width="10"/>
    <path d="M 350 276 L 346 228 L 362 272 Z" fill="#7a7a88" stroke="#1a1410" stroke-width="10"/>
    <!-- Chain link below -->
    <ellipse cx="256" cy="386" rx="28" ry="18" fill="none" stroke="url(#spiked_manacles_band)" stroke-width="16"/>
    <ellipse cx="256" cy="418" rx="22" ry="16" fill="none" stroke="url(#spiked_manacles_band)" stroke-width="16"/>
    <!-- Rivets on band -->
    <circle cx="178" cy="320" r="10" fill="url(#spiked_manacles_rivet)" stroke="#1a1410" stroke-width="6"/>
    <circle cx="334" cy="320" r="10" fill="url(#spiked_manacles_rivet)" stroke="#1a1410" stroke-width="6"/>
    <circle cx="256" cy="374" r="8" fill="url(#spiked_manacles_rivet)" stroke="#1a1410" stroke-width="5"/>
  </g>
</svg>
