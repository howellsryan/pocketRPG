<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="spiked_manacles_boot" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#5a5a62"/><stop offset="0.5" stop-color="#2e2e36"/><stop offset="1" stop-color="#141418"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Instep spikes pointing up -->
    <path d="M278 334 L284 276 L304 330 Z M320 332 L326 270 L346 328 Z M362 334 L368 280 L388 330 Z" fill="#8a8a96" stroke="#1a1410" stroke-width="10"/>
    <!-- Toe spikes pointing forward -->
    <path d="M426 356 L488 340 L432 322 Z M430 404 L486 410 L432 382 Z" fill="#8a8a96" stroke="#1a1410" stroke-width="10"/>
    <!-- Boot (side profile, toe to the right) -->
    <path d="M166 210 L264 210 L264 332 L392 332 C 414 332 430 350 430 374 L430 410 C 430 428 416 440 396 440 L196 440 C 176 440 162 426 162 406 Z" fill="url(#spiked_manacles_boot)"/>
    <!-- Ankle strap + buckle -->
    <rect x="156" y="250" width="118" height="34" rx="8" fill="#1a1a20" stroke="#1a1410" stroke-width="9"/>
    <circle cx="215" cy="267" r="11" fill="#8a8a96" stroke="#1a1410" stroke-width="6"/>
    <!-- Sole -->
    <path d="M180 440 L426 440 L426 468 L180 468 Z" fill="#1a1a20"/>
    <!-- Stud cleats -->
    <path d="M212 468 L206 492 L230 470 Z M300 468 L294 492 L318 470 Z M376 468 L370 492 L394 470 Z" fill="#6a6a74" stroke="#1a1410" stroke-width="8"/>
    <!-- Highlight -->
    <path d="M192 222 C 188 256 192 296 190 326" stroke="#7a7a88" stroke-width="6" fill="none" opacity="0.5"/>
  </g>
</svg>
