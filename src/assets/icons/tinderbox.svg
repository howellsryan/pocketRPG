<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tb_box" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#c89040"/><stop offset="0.55" stop-color="#9a6820"/><stop offset="1" stop-color="#5c3a08"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
    <!-- Box body -->
    <rect x="148" y="240" width="216" height="148" rx="12" fill="url(#tb_box)" stroke-width="13"/>
