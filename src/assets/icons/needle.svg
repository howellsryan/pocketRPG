<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ndl_body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e4d8"/><stop offset="0.4" stop-color="#c0bca8"/><stop offset="1" stop-color="#706c58"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
    <!-- Needle shaft (diagonal 45°) -->
    <path d="M 148 364 L 340 148" stroke="url(#ndl_body)" stroke-width="18" fill="none" stroke-linecap="round"/>
    <!-- Eye of needle (oval cutout near top) -->
    <ellipse cx="308" cy="178" rx="14" ry="20" fill="none" stroke="#1a1410" stroke-width="11" transform="rotate(-45 308 178)"/>
    <ellipse cx="308" cy="178" rx="7" ry="12" fill="#3a3028" stroke="none" transform="rotate(-45 308 178)"/>
    <!-- Needle tip point -->
    <path d="M 148 364 L 128 392 L 158 374 Z" fill="#c0bca8" stroke-width="10"/>
    <!-- Shine along shaft -->
    <path d="M 174 338 L 316 172" stroke="#f0ece0" stroke-width="6" fill="none" opacity="0.5"/>
    <!-- Thread hanging from eye -->
    <path d="M 298 164 C 278 140 268 120 280 96 C 286 82 296 78 302 88" stroke="#d04030" stroke-width="8" fill="none" opacity="0.75"/>
  </g>
</svg>
