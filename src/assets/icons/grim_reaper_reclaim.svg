    <path d="M290 284 C 322 292 348 306 366 326 L342 356 C 322 336 300 328 282 326 Z" fill="url(#grim_reaper_reclaim_gown)" stroke="#6a6577"/>
    <path d="M368 300 C 390 306 396 328 384 344 C 370 356 350 350 344 332 C 340 314 352 300 368 300 Z" fill="url(#grim_reaper_reclaim_bone)"/>
