    <path d="M226 106 C 218 128 218 152 226 162 C 236 152 236 128 226 106 Z" fill="#a8110d" stroke-width="9"/>
    <path d="M300 134 C 292 154 292 174 300 184 C 310 174 310 154 300 134 Z" fill="#a8110d" stroke-width="9"/>
    <path d="M362 168 C 354 184 354 198 362 206 C 372 198 372 184 362 168 Z" fill="#a8110d" stroke-width="9"/>
    <circle cx="228" cy="192" r="11" fill="#a8110d" stroke-width="9"/>
    <circle cx="302" cy="214" r="8" fill="#a8110d" stroke-width="8"/>
    <!-- Black gown -->
    <path d="M212 118 C 152 122 118 186 112 258 C 106 330 96 402 92 454 L136 422 L176 456 L214 422 L252 456 L292 422 L336 452 C 330 400 318 330 312 258 C 306 186 272 122 212 118 Z" fill="url(#grim_reaper_reclaim_gown)" stroke="#6a6577"/>
    <path d="M212 356 L206 434 M254 352 L266 424" fill="none" stroke="#3c3949" stroke-width="10"/>
    <!-- Hood cavity -->
    <path d="M212 148 C 160 150 134 200 132 262 C 130 318 166 352 212 352 C 258 352 294 318 292 262 C 290 200 264 150 212 148 Z" fill="#08070c"/>
    <!-- Bare skull in the hood -->
    <path d="M212 176 C 166 176 142 212 142 254 C 142 284 158 304 176 314 L176 334 C 176 342 182 348 190 348 L234 348 C 242 348 248 342 248 334 L248 314 C 266 304 282 284 282 254 C 282 212 258 176 212 176 Z" fill="url(#grim_reaper_reclaim_bone)"/>
    <ellipse cx="188" cy="252" rx="23" ry="27" fill="#17141c"/>
    <ellipse cx="238" cy="252" rx="23" ry="27" fill="#17141c"/>
    <path d="M212 280 L200 304 L212 312 L224 304 Z" fill="#17141c"/>
    <path d="M196 326 L196 348 M228 326 L228 348" fill="none" stroke="#17141c" stroke-width="9"/>
