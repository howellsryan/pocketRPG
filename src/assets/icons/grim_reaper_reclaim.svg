<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grim_reaper_reclaim_gown" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#3a3746"/><stop offset="0.55" stop-color="#1b1922"/><stop offset="1" stop-color="#0b0a0f"/>
    </linearGradient>
    <linearGradient id="grim_reaper_reclaim_bone" x1="0.35" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fbf7ec"/><stop offset="0.6" stop-color="#e2dccb"/><stop offset="1" stop-color="#b3ab97"/>
    </linearGradient>
    <linearGradient id="grim_reaper_reclaim_blade" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#eef2f6"/><stop offset="0.5" stop-color="#a8b0ba"/><stop offset="1" stop-color="#5a626c"/>
    </linearGradient>
    <linearGradient id="grim_reaper_reclaim_snath" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4423"/><stop offset="1" stop-color="#2a1a10"/>
    </linearGradient>
  </defs>
  <g stroke="#0b0a0f" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
