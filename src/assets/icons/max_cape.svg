<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="max_cape_body" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#1e1230"/><stop offset="0.5" stop-color="#12091e"/><stop offset="1" stop-color="#080410"/>
    </linearGradient>
    <radialGradient id="max_cape_star" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#fffac0"/><stop offset="0.4" stop-color="#f0c040"/><stop offset="1" stop-color="#8a6010" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Cape body — deep midnight purple-black -->
    <path d="M 158 80 C 140 80 128 90 122 100 L 88 420 Q 180 456 256 456 Q 332 456 424 420 L 390 100 C 384 90 372 80 354 80 Z" fill="url(#max_cape_body)"/>
    <!-- Collar -->
    <path d="M 158 80 L 354 80 L 340 110 L 256 120 L 172 110 Z" fill="#2a1848" stroke="#1a1410" stroke-width="11"/>
    <!-- Gold trim on edges -->
    <path d="M 122 100 L 88 420 Q 180 456 256 456" stroke="#c9a24a" stroke-width="9" fill="none"/>
    <path d="M 390 100 L 424 420 Q 332 456 256 456" stroke="#c9a24a" stroke-width="9" fill="none"/>
    <!-- Radiant gold star/glow at centre -->
    <ellipse cx="256" cy="280" rx="100" ry="100" fill="url(#max_cape_star)" stroke="none"/>
    <!-- Star rays -->
    <path d="M 256 200 L 262 252 L 296 220 L 268 262 L 320 260 L 274 278 L 310 310 L 264 292 L 266 346 L 248 300 L 214 334 L 236 286 L 184 286 L 234 270 L 196 238 L 250 260 Z" fill="#f0c040" stroke="none" opacity="0.6"/>
    <!-- Central gem -->
    <circle cx="256" cy="278" r="22" fill="#fff0a0" stroke="#c48f12" stroke-width="8"/>
    <circle cx="254" cy="274" r="10" fill="#ffffff" stroke="none"/>
    <!-- Clasp -->
    <circle cx="256" cy="95" r="18" fill="#f0c040" stroke="#8a6010" stroke-width="8"/>
    <circle cx="254" cy="92" r="8" fill="#ffffff" stroke="none"/>
  </g>
</svg>
