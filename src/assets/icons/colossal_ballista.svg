<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cb_wood" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#c89040"/><stop offset="0.5" stop-color="#9a6820"/><stop offset="1" stop-color="#5a3808"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main stock/frame (diagonal) -->
    <path d="M 120 400 L 400 120" stroke="url(#cb_wood)" stroke-width="28" stroke-linecap="round" fill="none"/>
    <!-- Tiller reinforcement -->
    <rect x="168" y="316" width="176" height="24" rx="6" fill="#8a6010" stroke-width="10" transform="rotate(-45 256 328)"/>
    <!-- Prod (bow arms) - large heavy limbs -->
    <path d="M 290 190 C 348 148 400 148 408 172 C 400 188 352 196 304 212 Z" fill="url(#cb_wood)" stroke-width="12"/>
    <path d="M 290 190 C 248 148 200 156 196 180 C 200 196 248 204 296 214 Z" fill="url(#cb_wood)" stroke-width="12"/>
    <!-- Bowstring (heavy cable) -->
    <path d="M 408 172 C 356 196 316 196 256 200 C 196 204 156 180 196 180" stroke="#e0d0b0" stroke-width="10" fill="none" opacity="0.8"/>
    <!-- Heavy bolt in groove -->
    <path d="M 200 336 L 310 208" stroke="#c0c0b0" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 310 208 L 326 190 L 334 200 L 316 220 Z" fill="#d0d0c0" stroke-width="10"/>
    <!-- Metal reinforcing bands on stock -->
    <path d="M 192 366 L 180 354" stroke="#a0a090" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M 240 320 L 228 308" stroke="#a0a090" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M 288 274 L 276 262" stroke="#a0a090" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- Winch at rear -->
    <circle cx="164" cy="384" r="20" fill="#808070" stroke-width="11"/>
    <circle cx="164" cy="384" r="10" fill="#606050" stroke-width="8"/>
  </g>
</svg>
