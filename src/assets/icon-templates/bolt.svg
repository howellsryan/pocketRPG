<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="{{id}}_tip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{light}}"/><stop offset="0.5" stop-color="{{base}}"/><stop offset="1" stop-color="{{shade}}"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-45 256 256)" stroke="#1a1410" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- Shaft (shorter and thicker than arrow) -->
    <rect x="244" y="178" width="24" height="196" rx="8" fill="#a3743f"/>
    <rect x="250" y="186" width="8" height="180" rx="4" fill="#c89a63" stroke="none"/>
    <!-- Metal tip -->
    <polygon points="256,126 286,186 256,174 226,186" fill="url(#{{id}}_tip)"/>
    <!-- Small fletchings -->
    <path d="M244 336 L218 376 L244 364 L244 350 Z" fill="{{shade}}" stroke="#1a1410" stroke-width="9"/>
    <path d="M268 336 L294 376 L268 364 L268 350 Z" fill="#d9d2c4" stroke="#1a1410" stroke-width="9"/>
    <!-- Nock -->
    <rect x="244" y="368" width="24" height="14" rx="5" fill="#5a3a1c"/>
  </g>
</svg>
