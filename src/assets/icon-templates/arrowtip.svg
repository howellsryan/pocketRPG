<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="{{id}}_metal" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="{{light}}"/><stop offset="0.5" stop-color="{{base}}"/><stop offset="1" stop-color="{{shade}}"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <!-- Three arrowheads in a fan arrangement -->
    <!-- Left tip -->
    <polygon points="172,118 202,220 172,208 142,220" fill="url(#{{id}}_metal)" transform="rotate(-15 172 170)"/>
    <!-- Center tip -->
    <polygon points="256,96 286,204 256,192 226,204" fill="url(#{{id}}_metal)"/>
    <!-- Right tip -->
    <polygon points="340,118 370,220 340,208 310,220" fill="url(#{{id}}_metal)" transform="rotate(15 340 170)"/>
    <!-- Highlight on center -->
    <path d="M 244 110 C 252 104 262 106 268 114" stroke="{{light}}" stroke-width="6" fill="none" opacity="0.7"/>
    <!-- Small stack base line -->
    <path d="M 140 290 L 372 290" stroke="{{shade}}" stroke-width="14" stroke-linecap="round"/>
    <path d="M 150 310 L 362 310" stroke="{{shade}}" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
