<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="{{id}}_stem" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="{{light}}"/><stop offset="0.6" stop-color="{{base}}"/><stop offset="1" stop-color="{{shade}}"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main stem -->
    <path d="M256 440 L256 180" stroke="{{shade}}" stroke-width="16" fill="none"/>
    <!-- Left leaf pair (lower) -->
    <path d="M256 370 C 210 340 172 310 176 278 C 190 296 220 336 256 350 Z" fill="url(#{{id}}_stem)"/>
    <!-- Right leaf pair (lower) -->
    <path d="M256 370 C 302 340 340 310 336 278 C 322 296 292 336 256 350 Z" fill="url(#{{id}}_stem)"/>
    <!-- Left leaf pair (upper) -->
    <path d="M256 290 C 204 260 168 228 172 196 C 188 214 222 258 256 270 Z" fill="url(#{{id}}_stem)"/>
    <!-- Right leaf pair (upper) -->
    <path d="M256 290 C 308 260 344 228 340 196 C 324 214 290 258 256 270 Z" fill="url(#{{id}}_stem)"/>
    <!-- Flower/bud at top -->
    <ellipse cx="256" cy="170" rx="30" ry="36" fill="{{light}}" stroke="{{shade}}" stroke-width="10"/>
    <ellipse cx="256" cy="158" rx="18" ry="20" fill="{{base}}" stroke="none"/>
    <!-- Leaf highlights -->
    <path d="M 248 370 C 220 345 204 318 206 298" stroke="{{light}}" stroke-width="6" fill="none" opacity="0.6"/>
  </g>
</svg>
