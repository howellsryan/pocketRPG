<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="{{id}}_face" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="{{light}}"/><stop offset="0.55" stop-color="{{base}}"/><stop offset="1" stop-color="{{shade}}"/>
    </radialGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Chain loop at top -->
    <path d="M 226 96 C 218 82 232 70 256 70 C 280 70 294 82 286 96" stroke="#c9a24a" stroke-width="14" fill="none"/>
    <!-- Charm body — round disc -->
    <circle cx="256" cy="296" r="168" fill="url(#{{id}}_face)"/>
    <!-- Inner ring decoration -->
    <circle cx="256" cy="296" r="130" fill="none" stroke="{{shade}}" stroke-width="8"/>
    <!-- Central symbol (star) -->
    <path d="M 256 204 L 268 268 L 330 244 L 292 296 L 336 348 L 272 332 L 268 396 L 248 334 L 182 344 L 222 292 L 180 242 L 244 268 Z" fill="{{shade}}" stroke="none" opacity="0.75"/>
