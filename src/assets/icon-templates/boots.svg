<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="{{id}}_body" x1="0.15" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="{{light}}"/><stop offset="0.5" stop-color="{{base}}"/><stop offset="1" stop-color="{{shade}}"/>
    </linearGradient>
    <linearGradient id="{{id}}_sole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{shade}}"/><stop offset="1" stop-color="#1a1410"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Sole -->
    <path d="M 102 408 L 434 408 L 434 430 Q 268 442 102 430 Z" fill="url(#{{id}}_sole)"/>
    <!-- Ankle shaft -->
    <path d="M 102 408 L 102 172 C 102 140 130 122 166 120 L 212 120 L 212 408 Z" fill="url(#{{id}}_body)"/>
    <!-- Foot body (ankle to toe) -->
    <path d="M 212 408 L 212 318 C 248 292 318 280 380 296 C 422 308 434 344 434 394 L 434 408 Z" fill="url(#{{id}}_body)"/>
    <!-- Cuff at ankle top -->
    <path d="M 90 172 L 226 164 L 226 138 C 226 116 208 106 180 106 L 130 106 C 108 106 90 120 90 146 Z" fill="{{base}}" stroke="#1a1410" stroke-width="11"/>
    <!-- Toe highlight -->
    <path d="M 364 298 C 416 318 434 360 432 400" stroke="{{light}}" stroke-width="9" fill="none"/>
    <!-- Shaft highlight -->
    <path d="M 136 192 C 144 295 142 358 138 402" stroke="{{light}}" stroke-width="7" fill="none" opacity="0.55"/>
    <!-- Buckle strap -->
    <rect x="174" y="236" width="64" height="18" rx="6" fill="{{shade}}" stroke="#1a1410" stroke-width="9"/>
    <rect x="196" y="228" width="20" height="34" rx="5" fill="#c9a24a" stroke="#1a1410" stroke-width="8"/>
  </g>
</svg>
