<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="{{id}}_body" x1="0.2" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="{{light}}"/><stop offset="0.5" stop-color="{{base}}"/><stop offset="1" stop-color="{{shade}}"/>
    </linearGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Main crystal -->
    <path d="M 256 76 L 308 174 L 340 306 L 256 452 L 172 306 L 204 174 Z" fill="url(#{{id}}_body)"/>
    <!-- Left facet -->
    <path d="M 256 76 L 204 174 L 256 210 Z" fill="{{light}}" stroke="{{shade}}" stroke-width="8" opacity="0.6"/>
    <!-- Right facet -->
    <path d="M 256 76 L 308 174 L 256 210 Z" fill="{{shade}}" stroke="{{shade}}" stroke-width="8" opacity="0.5"/>
    <!-- Highlight streak -->
    <path d="M 228 96 C 222 140 224 196 228 250" stroke="{{light}}" stroke-width="9" fill="none" opacity="0.65"/>
    <!-- Secondary small crystal -->
    <path d="M 338 148 L 360 196 L 374 270 L 338 356 L 316 270 L 324 196 Z" fill="url(#{{id}}_body)" stroke="#1a1410" stroke-width="10"/>
  </g>
</svg>
