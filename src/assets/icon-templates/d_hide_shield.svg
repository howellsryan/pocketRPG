<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="{{id}}_hide" cx="0.35" cy="0.32" r="0.75">
      <stop offset="0" stop-color="{{light}}"/><stop offset="0.55" stop-color="{{base}}"/><stop offset="1" stop-color="{{shade}}"/>
    </radialGradient>
  </defs>
  <g stroke="#1a1410" stroke-width="13" stroke-linejoin="round" stroke-linecap="round">
    <!-- Shield body -->
    <circle cx="256" cy="270" r="182" fill="url(#{{id}}_hide)" stroke="#1a1410" stroke-width="15"/>
    <!-- Metal rim accent -->
    <circle cx="256" cy="270" r="182" fill="none" stroke="#c9a24a" stroke-width="8"/>
    <!-- Hide grain curves -->
    <path d="M 146 182 C 182 198 212 214 256 218" stroke="{{light}}" stroke-width="7" fill="none" opacity="0.45"/>
    <path d="M 132 252 C 172 258 222 260 256 258" stroke="{{light}}" stroke-width="6" fill="none" opacity="0.35"/>
    <!-- Central boss -->
    <circle cx="256" cy="270" r="48" fill="#c9a24a" stroke="#1a1410" stroke-width="11"/>
    <circle cx="248" cy="260" r="18" fill="#fff0a0" stroke="none"/>
    <!-- Corner rivets -->
    <circle cx="162" cy="176" r="10" fill="#c9a24a" stroke="#8a6010" stroke-width="7"/>
    <circle cx="350" cy="176" r="10" fill="#c9a24a" stroke="#8a6010" stroke-width="7"/>
    <circle cx="150" cy="360" r="10" fill="#c9a24a" stroke="#8a6010" stroke-width="7"/>
    <circle cx="362" cy="360" r="10" fill="#c9a24a" stroke="#8a6010" stroke-width="7"/>
  </g>
</svg>
