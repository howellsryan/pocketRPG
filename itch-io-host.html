<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PocketRPG</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: #0e0e12; overflow: hidden; font-family: sans-serif; }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Initial loading overlay */
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #0e0e12;
      color: #d4af6a;
      font-size: 16px;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #loader svg { animation: spin 1s linear infinite; opacity: 0.8; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Auth panel — floating bottom-right */
    #auth-panel {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    #auth-toggle {
      background: #1a1a24;
      border: 1px solid #d4af6a55;
      color: #d4af6a;
      font-size: 13px;
      padding: 7px 12px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    #auth-toggle:hover { background: #25252f; }

    #auth-buttons {
      display: none;
      flex-direction: column;
      gap: 6px;
      background: #12121a;
      border: 1px solid #d4af6a44;
      border-radius: 8px;
      padding: 10px;
    }
    #auth-buttons.open { display: flex; }

    #auth-buttons p {
      color: #888;
      font-size: 11px;
      margin-bottom: 2px;
      text-align: center;
    }
    .auth-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #1e1e2a;
      border: 1px solid #333;
      color: #e0e0e0;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      width: 100%;
    }
    .auth-btn:hover { background: #28283a; border-color: #d4af6a55; }
    .auth-btn svg { flex-shrink: 0; }

    /* Waiting overlay shown while popup is open */
    #auth-waiting {
      display: none;
      position: fixed;
      inset: 0;
      background: #0008;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      flex-direction: column;
      gap: 16px;
      color: #d4af6a;
      font-size: 15px;
    }
    #auth-waiting.active { display: flex; }
    #auth-cancel {
      background: none;
      border: 1px solid #555;
      color: #888;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
    }
    #auth-cancel:hover { border-color: #888; color: #ccc; }
  </style>
</head>
<body>
  <div id="loader">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
      <circle cx="18" cy="18" r="15" stroke="#d4af6a" stroke-width="3" stroke-dasharray="60 30" />
    </svg>
    Loading PocketRPG…
  </div>

  <iframe
    id="game"
    src="https://pocketrpg.co.uk"
    allow="fullscreen"
    title="PocketRPG"
  ></iframe>

  <!-- Floating auth panel: opens auth in a popup so OAuth providers don't block it -->
  <div id="auth-panel">
    <div id="auth-buttons">
      <p>Sign in to your account</p>
      <button class="auth-btn" onclick="startAuth('github')">
        <!-- GitHub mark -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.44 9.8 8.2 11.38.6.11.82-.26.82-.58
            0-.28-.01-1.03-.02-2.02-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76
            -1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1
            .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22
            -.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 3-.4c1.02 0
            2.04.14 3 .4 2.28-1.55 3.29-1.23 3.29-1.23.66 1.66.24 2.88.12 3.18.77.84
            1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.48 5.92.43.37.81 1.1.81 2.22 0 1.6
            -.01 2.9-.01 3.29 0 .32.21.7.82.58C20.56 21.8 24 17.3 24 12c0-6.63-5.37-12-12-12z"/>
        </svg>
        Login with GitHub
      </button>
      <button class="auth-btn" onclick="startAuth('google')">
        <!-- Google G -->
        <svg width="18" height="18" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Login with Google
      </button>
    </div>
    <button id="auth-toggle" onclick="toggleAuth()">Login ▲</button>
  </div>

  <!-- Dim overlay while popup is open -->
  <div id="auth-waiting">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" style="animation:spin 1s linear infinite">
      <circle cx="18" cy="18" r="15" stroke="#d4af6a" stroke-width="3" stroke-dasharray="60 30" />
    </svg>
    Complete login in the popup window…
    <button id="auth-cancel" onclick="cancelAuth()">Cancel</button>
  </div>

  <script>
    var frame   = document.getElementById('game');
    var loader  = document.getElementById('loader');
    var waiting = document.getElementById('auth-waiting');
    var buttons = document.getElementById('auth-buttons');
    var toggle  = document.getElementById('auth-toggle');
    var authPopup = null;
    var pollTimer = null;

    frame.addEventListener('load', function () {
      loader.style.opacity = '0';
      setTimeout(function () { loader.style.display = 'none'; }, 400);
    });

    function toggleAuth() {
      var open = buttons.classList.toggle('open');
      toggle.textContent = open ? 'Login ▼' : 'Login ▲';
    }

    function startAuth(provider) {
      // Close the dropdown
      buttons.classList.remove('open');
      toggle.textContent = 'Login ▲';

      var url = 'https://pocketrpg.co.uk/api/auth/' + provider;
      var opts = 'width=620,height=700,menubar=no,toolbar=no,location=yes,scrollbars=yes';
      authPopup = window.open(url, 'pocketrpg-auth', opts);

      if (!authPopup) {
        // Popup was blocked — fall back to redirecting the main page
        window.location.href = url;
        return;
      }

      waiting.classList.add('active');

      // Poll until the popup closes, then reload the iframe
      pollTimer = setInterval(function () {
        if (!authPopup || authPopup.closed) {
          clearInterval(pollTimer);
          pollTimer = null;
          authPopup = null;
          waiting.classList.remove('active');
          // Reload the iframe so it picks up the token now in localStorage
          frame.src = frame.src;
        }
      }, 500);
    }

    function cancelAuth() {
      if (authPopup && !authPopup.closed) authPopup.close();
      if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      authPopup = null;
      waiting.classList.remove('active');
    }
  </script>
</body>
</html>
